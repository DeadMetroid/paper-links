    boxIso(ctx, x, y - 30 * U, 1.0, 0.6, 12 * U, [214, 92, 84]);
    ctx.restore();
  },
  cart: function (ctx, x, y) {
    // Wheels at the BOTTOM CORNERS of the box's two camera-facing faces. Centred on the
    // anchor they read as two dots painted on its lid; tucked wholly behind it they read
    // as nothing at all. The prop sheet showed both in a second.
    boxIso(ctx, x, y, 1.6, 1.0, 11 * U, [212, 206, 188]);
    orb(ctx, x + 32 * U, y + 20 * U, 7 * U, [78, 72, 68]);
    orb(ctx, x - 2 * U, y + 30 * U, 7 * U, [78, 72, 68]);
  },
  gate: function (ctx, x, y) {
    tubeP(ctx, x, y, 2.4 * U, 24 * U, [230, 224, 208]);
    boxIso(ctx, x, y - 24 * U, 1.3, 0.25, 8 * U, [240, 176, 90]);
  },
  golfer: function (ctx, x, y, t, b) {
    tubeP(ctx, x, y, 5 * U, 18 * U, [92, 122, 182]);
    orb(ctx, x, y - 24 * U, 6.5 * U, [232, 200, 168]);
    coneP(ctx, x, y - 28 * U, 8 * U, 7 * U, [232, 96, 96]);
    var f = b.face || 0;
    ctx.beginPath();
    ctx.moveTo(x, y - 16 * U);
    ctx.lineTo(x + Math.cos(f) * 18 * U, y - 4 * U + Math.sin(f) * 9 * U);
    ctx.strokeStyle = 'rgb(228,224,208)'; ctx.lineWidth = 2.4 * U; rStroke(ctx);
  },
  dog: function (ctx, x, y, t, b) {
    var f = b.face || 0, d = Math.cos(f) >= 0 ? 1 : -1;
    boxIso(ctx, x, y, 0.9, 0.5, 8 * U, [204, 154, 96]);
    orb(ctx, x + 9 * U * d, y - 10 * U, 5 * U, [216, 168, 108]);
    coneP(ctx, x + 13 * U * d, y - 11 * U, 3.4 * U, 5 * U, [180, 130, 80]);
  },
  goose: function (ctx, x, y, t, b) {
    var f = b.face || 0, d = Math.cos(f) >= 0 ? 1 : -1;
    orb(ctx, x, y - 7 * U, 8 * U, [246, 244, 236]);
    tubeP(ctx, x + 5 * U * d, y - 10 * U, 2.2 * U, 13 * U, [238, 236, 226]);
    orb(ctx, x + 5 * U * d, y - 24 * U, 3.4 * U, [238, 236, 226]);
    ctx.beginPath();
    ctx.moveTo(x + 5 * U * d, y - 25 * U);
    ctx.lineTo(x + 12 * U * d, y - 23 * U);
    ctx.lineTo(x + 5 * U * d, y - 21 * U);
    ctx.closePath();
    ctx.fillStyle = 'rgb(240,160,64)'; rFill(ctx);
  },
  rival: function (ctx, x, y, t, b) {
    // The one threat you beat rather than avoid, so it reads as a marble, not a machine.
    var r = b.r * TILE / Math.SQRT2 * 0.9;
    orb(ctx, x, y - r * 0.5, r, [196, 108, 168]);
    ctx.beginPath();
    ctx.arc(x - r * 0.25, y - r * 0.75, r * 0.30, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.55)'; rFill(ctx);
  },
  sprinkler: function (ctx, x, y, t, b) {
    tubeP(ctx, x, y, 2.6 * U, 9 * U, [150, 168, 148]);
    if (!b.on) return;
    var a = b.def.omega * t + b.phase;
    for (var i = 0; i < 6; i++) {
      var an = a * 2 + i * Math.PI / 3;
      ctx.beginPath();
      ctx.moveTo(x, y - 9 * U);
      ctx.lineTo(x + Math.cos(an) * b.def.r * TILE * 0.5,
                 y - 9 * U + Math.sin(an) * b.def.r * TILE * 0.25);
      ctx.strokeStyle = 'rgba(150,205,235,0.6)'; ctx.lineWidth = 2 * U; rStroke(ctx);
    }
  },
  muncher: function (ctx, x, y, t, b) {
    // A RIM around the mouth, not a body over it. Drawn the other way round the housing
    // covered the very thing that takes the ball.
    var mouth = b.def.r * 0.28 * TILE / Math.SQRT2;
    ctx.beginPath();
    ctx.ellipse(x, y - 4 * U, mouth * 1.34, mouth * 0.72, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgb(138,132,150)'; rFill(ctx);
    ctx.beginPath();
    ctx.moveTo(x - mouth * 1.34, y - 4 * U);
    ctx.lineTo(x - mouth * 1.34, y + 3 * U);
    ctx.lineTo(x + mouth * 1.34, y + 3 * U);
    ctx.lineTo(x + mouth * 1.34, y - 4 * U);
    ctx.closePath();
    ctx.fillStyle = 'rgb(96,90,108)'; rFill(ctx);
    ctx.beginPath();
    ctx.ellipse(x, y - 4 * U, mouth, mouth * 0.5, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgb(18,15,24)'; rFill(ctx);
    // THE POINT OF NO RETURN, drawn. Inside r*(1 - K/pull) no amount of input climbs back
    // out, and a point of no return you cannot see is just an unfair death.
    var hold = muncherHold(b.def);
    ctx.beginPath();
    ctx.ellipse(x, y, hold * TILE / Math.SQRT2, hold * TILE / (2 * Math.SQRT2), 0, 0, Math.PI * 2);
    ctx.strokeStyle = COL_WARN; ctx.lineWidth = 2 * U;
    ctx.setLineDash([7 * U, 6 * U]);
    rStroke(ctx);
    ctx.setLineDash([]);
  },
};

// ---- the ball -----------------------------------------------------------------
// Five things make it read as a three-dimensional golf ball, and they are cheap: a
// contact shadow, dimples that actually rotate, radial shading from the terrain's own
// light, squash on impact, and the flattened state — which is a different SHAPE, not a
// different colour. It is the thing on screen the whole time.
var VIEW = (function () {
  var v = [-1, -1, 1.6], m = Math.hypot(v[0], v[1], v[2]);
  return [v[0] / m, v[1] / m, v[2] / m];
})();

var DIMPLES = (function () {
  // A deterministic Fibonacci sphere. No RNG anywhere in a path the game takes.
  var n = 34, out = [], ga = Math.PI * (3 - Math.sqrt(5));
  for (var i = 0; i < n; i++) {
    var zz = 1 - (2 * i + 1) / n;
    var r = Math.sqrt(Math.max(0, 1 - zz * zz));
    var th = ga * i;
    out.push([Math.cos(th) * r, Math.sin(th) * r, zz]);
  }
  return out;
})();

function drawBall(ctx, run, cam) {
  var b = run.ball, g = run.grid;
  if (b.state === ST.HOLED && run.holeT > HOLE_TIME + 1.2) return;

  var sx = projX(cam, b.x, b.y);
  var sy = projY(cam, b.x, b.y, b.z);
  var r = BALL_R * TILE / Math.SQRT2;

  // The contact shadow reads the SOLID MASK, exactly as physics does — not heightAt,
  // which over the void answers with the two-ring dilation and sails the shadow out over
  // nothing.
  if (solidAt(g, b.x, b.y) === 1 && b.state !== ST.SINK) {
    var gz = heightAt(g, b.x, b.y);
    var drop = Math.max(0, b.z - gz);
    var f = 1 / (1 + drop * 0.55);
    ctx.beginPath();
    ctx.ellipse(projX(cam, b.x, b.y), projY(cam, b.x, b.y, gz),
                r * 0.95 * f, r * 0.48 * f, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(18,26,20,' + (0.34 * f).toFixed(3) + ')';
    rFill(ctx);
  }

  var sq = b.squash, flat = b.flat > 0;
  var rx = r * (flat ? 1.5 : 1 + sq * 0.30);
  var ry = r * (flat ? 0.22 : 1 - sq * 0.32);

  ctx.save();
  if (b.state === ST.HOLED) {
    // Clipped TO the opening, so the near lip cuts the ball off. A flat dark ellipse
    // sorted in front of the ball is the single most-reported defect this game has had.
    var c = run.course.cup;
    var cx = projX(cam, c.x, c.y), cy = projY(cam, c.x, c.y, c.z);
    var crx = c.r * TILE / Math.SQRT2;
    ctx.beginPath();
    ctx.ellipse(cx, cy, crx, crx / 2, 0, 0, Math.PI * 2);
    ctx.clip();
  }

  ctx.beginPath();
  ctx.ellipse(sx, sy - ry, rx, ry, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgb(238,240,232)'; rFill(ctx);
  ctx.beginPath();
  ctx.ellipse(sx + rx * 0.34, sy - ry + ry * 0.30, rx * 0.72, ry * 0.72, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgb(178,186,178)'; rFill(ctx);
  ctx.beginPath();
  ctx.ellipse(sx - rx * 0.30, sy - ry - ry * 0.32, rx * 0.50, ry * 0.44, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgb(252,253,248)'; rFill(ctx);

  // Dimples that ACTUALLY ROTATE: ball.spin is accumulated rolling-without-slipping about
  // ball.spinAxis, so they turn at the speed the ball is travelling and stop when it stops.
  if (!flat) {
    var ax = -b.spinAxis[1], ay = b.spinAxis[0], az = 0;   // the rolling axis, horizontal
    var ca = Math.cos(b.spin), sa = Math.sin(b.spin);
    ctx.beginPath();
    for (var i = 0; i < DIMPLES.length; i++) {
      var d = DIMPLES[i];
      // Rodrigues about (ax, ay, 0), which is a unit vector by construction.
      var dot = d[0] * ax + d[1] * ay;
      var vx = d[0] * ca + (ay * d[2] - az * d[1]) * sa + ax * dot * (1 - ca);
      var vy = d[1] * ca + (az * d[0] - ax * d[2]) * sa + ay * dot * (1 - ca);
      var vz = d[2] * ca + (ax * d[1] - ay * d[0]) * sa;
      if (vx * VIEW[0] + vy * VIEW[1] + vz * VIEW[2] < 0.12) continue;
      var px = (vx - vy) * 0.7071, py = -(vz * 0.86 + (vx + vy) * 0.26);
      var dr = rx * 0.11 * (0.55 + 0.45 * (vx * VIEW[0] + vy * VIEW[1] + vz * VIEW[2]));
      ctx.moveTo(sx + px * rx * 0.92 + dr, sy - ry + py * ry * 0.92);
      ctx.arc(sx + px * rx * 0.92, sy - ry + py * ry * 0.92, dr, 0, Math.PI * 2);
    }
    ctx.fillStyle = 'rgba(150,160,152,0.55)'; rFill(ctx);
  }
  ctx.restore();
}

// LAW 4.5 — the ball is the exception to sorting on wx+wy. The moment it is off the paper
// and below the paper beside it, height is the whole of the difference, and at 1.4 bands
// per unit a drop of ONE unit outweighs any fixed sprite bias.
function ballDepth(run) {
  var b = run.ball, g = run.grid;
  var flat = b.x + b.y + PROP_BIAS;
  if (b.state === ST.SINK) return flat;      // composed at the water's own depth
  var best = flat;
  for (var t = BALL_STEP; t <= BALL_REACH; t += BALL_STEP) {
    var x = b.x + t, y = b.y + t;
    if (solidAt(g, x, y) !== 1) continue;
    if (b.z + Z_BAND * t > heightAt(g, x, y)) continue;
    // The CELL's band, not the distance walked. A quarter-tile stride steps straight over
    // lips the ball clears by a hand's width, which is the whole question.
    var k = Math.floor(x) + Math.floor(y) - 0.5;
    if (k < best) best = k;
    break;
  }
  return best;
}

// ---- the cup ------------------------------------------------------------------
// A 3-D shaft, sorted BEHIND the ball: opening, lit far wall, floor.
function drawCup(ctx, run, cam) {
  var c = run.course.cup;
  var cx = projX(cam, c.x, c.y), cy = projY(cam, c.x, c.y, c.z);
  var rx = c.r * TILE / Math.SQRT2, ry = rx / 2;
  var dz = CUP_DEPTH * Z_SCALE;

  ctx.beginPath();                                   // the shaft's far wall
  ctx.moveTo(cx - rx, cy);
  ctx.lineTo(cx - rx, cy + dz);
  ctx.lineTo(cx + rx, cy + dz);
  ctx.lineTo(cx + rx, cy);
  ctx.closePath();
  ctx.fillStyle = 'rgb(52,46,42)'; rFill(ctx);
  ctx.beginPath();                                   // the floor, lit
  ctx.ellipse(cx, cy + dz, rx, ry, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgb(96,84,70)'; rFill(ctx);
  ctx.beginPath();                                   // the opening
  ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgb(28,24,26)'; rFill(ctx);
  ctx.beginPath();
  ctx.ellipse(cx, cy, rx, ry, 0, Math.PI * 1.05, Math.PI * 1.95);
  ctx.strokeStyle = 'rgba(246,241,226,0.6)'; ctx.lineWidth = 2 * U; rStroke(ctx);
}

// ---- flags --------------------------------------------------------------------
function drawFlag(ctx, run, cam, i) {
  var f = run.course.flags[i], g = run.grid;
  var z = heightAt(g, f.x, f.y);
  var raise = run.flagRaise[i];
  var sx = projX(cam, f.x, f.y), sy = projY(cam, f.x, f.y, z);
  var poleH = (14 + 20 * raise) * U;

  ctx.beginPath();                                   // the trigger, drawn on the ground
  ctx.ellipse(sx, sy, f.r * TILE / Math.SQRT2, f.r * TILE / (2 * Math.SQRT2), 0, 0, Math.PI * 2);
  ctx.strokeStyle = raise > 0 ? 'rgba(255,93,93,0.30)' : 'rgba(246,241,226,0.30)';
  ctx.lineWidth = 2 * U; rStroke(ctx);

  tubeP(ctx, sx, sy, 1.6 * U, poleH, [236, 232, 216]);
  if (raise <= 0) return;
  // The cloth BENDS in the wind. A flag that raises on a checkpoint and then stands rigid
  // is a flag that only moved once.
  var w = wind(run.t, i * 1.7) * 5 * U;
  var top = sy - poleH;
  ctx.beginPath();
  ctx.moveTo(sx, top);
  ctx.quadraticCurveTo(sx + 14 * U + w, top + 2 * U, sx + 24 * U + w * 1.6, top + 8 * U);
  ctx.quadraticCurveTo(sx + 13 * U + w, top + 10 * U, sx, top + 13 * U);
  ctx.closePath();
  ctx.fillStyle = COL_FLAG; rFill(ctx);
}

// ---- the sweep -----------------------------------------------------------------
// Terrain one ascending diagonal band at a time, each cell emitting its own two
// camera-facing side faces. That is an exact painter's algorithm here, and
// all-walls-then-all-ground is not. Props and the ball are MERGED into the same sweep —
// painting them over the finished world puts a ball that fell off the BACK of a slab in
// front of it.

function bandIndex(course) {
  if (course.bands) return course.bands;
  var g = course.grid, m = {};
  // Bands are keyed in WORLD units — wx + wy — not grid indices. Sprite depth keys are
  // world-space too (ballDepth is), and a grid-index band is that minus (ox + oy): the
  // two disagreeing by the origin offset puts the ball behind the ground it stands on.
  for (var j = 0; j < g.ny; j++) for (var i = 0; i < g.nx; i++) {
    if (!g.solid[j * g.nx + i]) continue;
    var b = (g.ox + i) + (g.oy + j);
    (m[b] || (m[b] = [])).push(i, j);
  }
  var lo = Infinity, hi = -Infinity;
  Object.keys(m).forEach(function (k) {
    var n = +k; if (n < lo) lo = n; if (n > hi) hi = n;
  });
  course.bands = { map: m, lo: lo, hi: hi };
  return course.bands;
}

function collectSprites(run, cam) {
  var out = [];
  var c = run.course, g = run.grid;
  for (var i = 0; i < run.bodies.length; i++) {
    var b = run.bodies[i];
    if (!b.active) continue;
    out.push({ k: b.x + b.y + PROP_BIAS, kind: 'body', b: b });
  }
  for (var f = 0; f < c.flags.length; f++)
    out.push({ k: c.flags[f].x + c.flags[f].y + PROP_BIAS, kind: 'flag', i: f });
  out.push({ k: c.cup.x + c.cup.y, kind: 'cup' });
  out.push({ k: ballDepth(run), kind: 'ball' });
  out.sort(function (a, b2) { return a.k - b2.k; });
  return out;
}

function drawSprite(ctx, run, cam, s) {
  if (s.kind === 'ball') { drawBall(ctx, run, cam); return; }
  if (s.kind === 'cup') { drawCup(ctx, run, cam); return; }
  if (s.kind === 'flag') { drawFlag(ctx, run, cam, s.i); return; }
  var b = s.b;
  var sx = projX(cam, b.x, b.y), sy = projY(cam, b.x, b.y, b.z);
  // A prop draws OUTWARD from its anchor, so the pad is the furthest anything reaches.
  // Never cull the ball or the cup: the camera is on one and aimed at the other.
  if (sx < -PROP_PAD_X || sx > W + PROP_PAD_X) return;
  if (sy < -PROP_PAD_TOP || sy > H + PROP_PAD_BOTTOM) return;
  RSTAT.props++;

  // Every mover paints its own footprint at its true r + BALL_R, and smears a trail along
  // its own velocity. A hazard with no motion tell is a hazard the player learns by dying.
  if (b.prim !== 'STATIC') {
    var fr = (b.r + BALL_R) * TILE / Math.SQRT2;
    ctx.beginPath();
    ctx.ellipse(sx, sy, fr, fr / 2, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,166,58,0.22)'; rFill(ctx);
    var sp = Math.hypot(b.vx, b.vy);
    if (sp > 0.6) {
      var tx = projX(cam, b.x - b.vx * 0.18, b.y - b.vy * 0.18);
      var ty = projY(cam, b.x - b.vx * 0.18, b.y - b.vy * 0.18, b.z);
      ctx.beginPath();
      ctx.moveTo(sx, sy); ctx.lineTo(tx, ty);
      ctx.strokeStyle = 'rgba(255,166,58,0.30)'; ctx.lineWidth = fr * 0.8; rStroke(ctx);
    }
  }
  var art = ART[b.art];
  if (art) art(ctx, sx, sy, run.t, b);
}

function sweep(ctx, run, cam) {
  var c = run.course, g = run.grid, W1 = g.nx + 1;
  var bi = bandIndex(c);
  var camS = cam.x + cam.y;
  var sprites = collectSprites(run, cam);
  var si = 0;

  // The band range, bounded by the course's own height spread rather than guessed.
  var zSlack = ((c.grid._zSpread === undefined)
    ? (c.grid._zSpread = zSpread(c.grid)) : c.grid._zSpread);
  var slack = (zSlack * Z_SCALE + CELL_UP + CELL_DOWN) / (TILE / 4) + 2;
  var b0 = Math.max(bi.lo, Math.floor(camS - (H * BALL_Y + CELL_UP) / (TILE / 4) - slack));
  var b1 = Math.min(bi.hi, Math.ceil(camS + (H * (1 - BALL_Y) + CELL_DOWN) / (TILE / 4) + slack));

  var tops = {}, walls = {}, folds = [], creases = [];

  for (var band = b0; band <= b1; band++) {
    while (si < sprites.length && sprites[si].k < band) drawSprite(ctx, run, cam, sprites[si++]);
    var list = bi.map[band];
    if (!list) continue;

    for (var q = 0; q < list.length; q += 2) {
      var i = list[q], j = list[q + 1];
      var ck = j * g.nx + i;
      if (!g.solid[ck]) continue;                       // a fragile tile that has gone
      var x0 = g.ox + i, y0 = g.oy + j;

      var hA = g.h[j * W1 + i], hB = g.h[j * W1 + i + 1];
      var hD = g.h[(j + 1) * W1 + i], hC = g.h[(j + 1) * W1 + i + 1];
      var hc = (hA + hB + hC + hD) * 0.25;

      var ax = projX(cam, x0 + 0.5, y0 + 0.5), ay = projY(cam, x0 + 0.5, y0 + 0.5, hc);
      if (ax < -CELL_SIDE || ax > W + CELL_SIDE) continue;
      if (ay < -CELL_UP || ay > H + CELL_DOWN) continue;
      RSTAT.cells++;

      var pAx = projX(cam, x0, y0),         pAy = projY(cam, x0, y0, hA);
      var pBx = projX(cam, x0 + 1, y0),     pBy = projY(cam, x0 + 1, y0, hB);
      var pCx = projX(cam, x0 + 1, y0 + 1), pCy = projY(cam, x0 + 1, y0 + 1, hC);
      var pDx = projX(cam, x0, y0 + 1),     pDy = projY(cam, x0, y0 + 1, hD);

      var surf = g.surf[ck];
      var gx = ((hB - hA) + (hC - hD)) * 0.5;
      var gy = ((hD - hA) + (hC - hB)) * 0.5;
      var nl = Math.hypot(gx, gy, 1);
      var sk = shadeBucket(-gx / nl, -gy / nl, 1 / nl);
      var key = surf * SHADES + sk;
      (tops[key] || (tops[key] = [])).push(pAx, pAy, pBx, pBy, pCx, pCy, pDx, pDy);

      // Terrain is continuous across any connected run of paper — neighbouring cells
      // share corners — so the only true steps in this world are the cliffs across a
      // void. A wall goes exactly where the neighbour is not there.
      var eastVoid = (i + 1 >= g.nx) || !g.solid[ck + 1];
      var southVoid = (j + 1 >= g.ny) || !g.solid[ck + g.nx];
      if (eastVoid) {
        (walls[surf] || (walls[surf] = [])).push(pBx, pBy, pCx, pCy);
        if (pBy < H && pBy > -TILE) creases.push(pBx, pBy, pCx, pCy);
      }
      if (southVoid) {
        (walls[surf] || (walls[surf] = [])).push(pDx, pDy, pCx, pCy);
        if (pDy < H && pDy > -TILE) creases.push(pDx, pDy, pCx, pCy);
      }
      // Fold lines: the papercraft. Only where there IS a neighbour — an edge over the
      // void is a cut, not a fold, and the wall below it already reads as one.
      if (!eastVoid && ay > -TILE && ay < H) folds.push(pBx, pBy, pCx, pCy);
      if (!southVoid && ay > -TILE && ay < H) folds.push(pDx, pDy, pCx, pCy);
    }

    flushWalls(ctx, walls);
    flushTops(ctx, tops);
    flushLines(ctx, folds, 'rgba(246,241,226,0.30)', 1);
    flushCreases(ctx, creases);
  }
  while (si < sprites.length) drawSprite(ctx, run, cam, sprites[si++]);
}

function zSpread(g) {
  var lo = Infinity, hi = -Infinity;
  for (var k = 0; k < g.h.length; k++) {
    if (!g.hp[k]) continue;
    if (g.h[k] < lo) lo = g.h[k];
    if (g.h[k] > hi) hi = g.h[k];
  }
  return hi - lo;
}

// Bucketed by surface AND shade, so the visible course is a few dozen fills per band
// rather than a few thousand cells. Within one band nothing overlaps anything else in it,
// which is what makes the bucketing safe: the painter's order is BETWEEN bands.
function flushTops(ctx, tops) {
  for (var key in tops) {
    var q = tops[key];
    ctx.beginPath();
    for (var i = 0; i < q.length; i += 8) {
      ctx.moveTo(q[i], q[i + 1]);
      ctx.lineTo(q[i + 2], q[i + 3]);
      ctx.lineTo(q[i + 4], q[i + 5]);
      ctx.lineTo(q[i + 6], q[i + 7]);
      ctx.closePath();
    }
    ctx.fillStyle = SHADE_TABLE[(key / SHADES) | 0][key % SHADES];
    rFill(ctx);
    delete tops[key];
  }
}

// Wall bottoms are ABSOLUTE screen coordinates, not an offset below the wall's own edge:
// anchored to its own edge, a slab you have already passed stops reaching the frame and
// the band sweep then culls it outright — the ground behind you despawns as you descend.
//
// One fill per surface per band, down a vertical gradient. A flat colour keyed to the
// wall's own top is what this replaced: a wall that starts near the horizon then stayed
// bright the whole way to the bottom of the frame, and the abyss stopped reading as depth.
// Every wall in a band starts at nearly the same screen y, so one gradient serves them all.
function flushWalls(ctx, walls) {
  for (var key in walls) {
    var q = walls[key];
    var top = Infinity;
    ctx.beginPath();
    for (var i = 0; i < q.length; i += 4) {
      if (q[i + 1] < top) top = q[i + 1];
      if (q[i + 3] < top) top = q[i + 3];
      ctx.moveTo(q[i], q[i + 1]);
      ctx.lineTo(q[i + 2], q[i + 3]);
      ctx.lineTo(q[i + 2], WALL_BOTTOM);
      ctx.lineTo(q[i], WALL_BOTTOM);
      ctx.closePath();
    }
    var gr = ctx.createLinearGradient(0, top, 0, WALL_BOTTOM);
    gr.addColorStop(0, WALL_TABLE[key][wallRow(top)]);
    gr.addColorStop(0.42, WALL_TABLE[key][Math.min(WALL_ROWS - 1, wallRow(top) + 7)]);
    gr.addColorStop(1, ABYSS);
    ctx.fillStyle = gr;
    rFill(ctx);
    delete walls[key];
  }
}

function flushLines(ctx, pts, style, width) {
  if (!pts.length) return;
  ctx.beginPath();
  for (var i = 0; i < pts.length; i += 4) {
    ctx.moveTo(pts[i], pts[i + 1]);
    ctx.lineTo(pts[i + 2], pts[i + 3]);
  }
  ctx.strokeStyle = style; ctx.lineWidth = width;
  rStroke(ctx);
  pts.length = 0;
}

// Vertical creases run WALL_CREASE world units down a wall and stop. Culled against the
// frame, because a crease hundreds of pixels off screen still costs a stroke.
function flushCreases(ctx, pts) {
  if (!pts.length) return;
  var drop = WALL_CREASE * Z_SCALE;
  ctx.beginPath();
  var any = false;
  for (var i = 0; i < pts.length; i += 4) {
    for (var e = 0; e < 2; e++) {
      var x = pts[i + e * 2], y = pts[i + e * 2 + 1];
      if (x < -8 || x > W + 8) continue;
      if (y > H) continue;
      var y1 = Math.min(y + drop, H);
      if (y1 <= 0) continue;
      ctx.moveTo(x, Math.max(y, 0)); ctx.lineTo(x, y1);
      any = true;
    }
  }
  pts.length = 0;
  if (!any) return;
  ctx.strokeStyle = 'rgba(0,0,0,0.16)'; ctx.lineWidth = 1;
  rStroke(ctx);
}

function drawWorld(ctx, run, cam) {
  RSTAT.fills = 0; RSTAT.strokes = 0; RSTAT.cells = 0; RSTAT.props = 0;
  drawBackdrop(ctx, cam, run.t);
  sweep(ctx, run, cam);
}

/* ===== src/save.js ===== */
// SAVE — localStorage, versioned and defensive, namespaced.
//
// localStorage works on file:// and survives a full browser restart. The slot's name is
// frozen; the PAYLOAD carries its own version, and a payload of the wrong version is
// thrown away for a fresh round rather than migrated. Reachable from real UI, never from
// a debug key.

var SAVE_KEY = 'paperlinks_save_v1';
var SAVE_VERSION = 1;

function blankSave(n) {
  var cards = [];
  for (var i = 0; i < n; i++) cards.push(null);
  return { v: SAVE_VERSION, unlocked: 1, pointer: 0, cards: cards };
}

function loadSave(n) {
  var raw = null;
  try { raw = window.localStorage.getItem(SAVE_KEY); } catch (e) { return blankSave(n); }
  if (!raw) return blankSave(n);
  var p;
  try { p = JSON.parse(raw); } catch (e) { return blankSave(n); }
  if (!p || p.v !== SAVE_VERSION || !Array.isArray(p.cards)) return blankSave(n);
  var s = blankSave(n);
  s.unlocked = Math.max(1, Math.min(n, p.unlocked | 0));
  s.pointer = Math.max(0, Math.min(n - 1, p.pointer | 0));
  for (var i = 0; i < n; i++) {
    var c = p.cards[i];
    // A card unlocks nothing on its own: `unlocked` is the only gate, and it is clamped.
    if (c && typeof c.net === 'number' && typeof c.shots === 'number' && isFinite(c.net))
      s.cards[i] = { net: c.net, shots: c.shots | 0 };
  }
  return s;
}

function writeSave(s) {
  try { window.localStorage.setItem(SAVE_KEY, JSON.stringify(s)); } catch (e) { /* full or blocked */ }
}

function eraseSave() {
  try { window.localStorage.removeItem(SAVE_KEY); } catch (e) { /* nothing to erase */ }
}

function hasProgress(s) {
  if (s.unlocked > 1) return true;
  for (var i = 0; i < s.cards.length; i++) if (s.cards[i]) return true;
  return false;
}

/* ===== src/game.js ===== */
// GAME — the state machine, the input mapping, the clock's arithmetic, and the frame
// accumulator. Everything here is above the simulation and below the renderer.

var APP = {
  state: 'LOADING', loadIdx: 0,
  run: null, cam: null, course: 0,
  save: null, menuIdx: 0, selIdx: 0,
  iris: null, keys: {}, acc: 0, last: -1,
  muted: false, perf: false,
  perfNow: 0, perfFrame: 0, perfWorst: 0,
  toast: 0, toastText: '',
};

// ---- input --------------------------------------------------------------------
// Screen-relative, always. W fights the descent; W+A fights a descent that also banks
// right, and that balancing act IS the game. The mapping is forced by the projection: get
// a sign wrong and every course is unplayable in a way no test will name.
function inputVector(keys) {
  var wx = 0, wy = 0;
  if (keys.up)    { wx -= 1; wy -= 1; }      // up-screen:   -(wx+wy)
  if (keys.down)  { wx += 1; wy += 1; }
  if (keys.left)  { wx -= 1; wy += 1; }      // left-screen: -(wx-wy)
  if (keys.right) { wx += 1; wy -= 1; }
  var m = Math.hypot(wx, wy);
  return m < 1e-9 ? [0, 0] : [wx / m, wy / m];
}

var KEYMAP = {
  KeyW: 'up', ArrowUp: 'up', KeyS: 'down', ArrowDown: 'down',
  KeyA: 'left', ArrowLeft: 'left', KeyD: 'right', ArrowRight: 'right',
};

// ---- the clock, read as golf ----------------------------------------------------
// LAW 11.1 — the clock counts UP, checkpoints pay it down, and it can never end a course.
// Bands are a quarter of par wide with a 3-second floor: a fixed band would be the whole
// practice green and a rounding error on the long sixth.
function bandStep(parTime) { return Math.max(3, parTime / 4); }

function timeShots(net, parTime) {
  var s = Math.round((net - parTime) / bandStep(parTime));
  return s < -4 ? -4 : (s > 12 ? 12 : s);
}

var SHOT_NAME = { '-4': 'ALBATROSS', '-3': 'ALBATROSS', '-2': 'EAGLE', '-1': 'BIRDIE',
                  '0': 'PAR', '1': 'BOGEY', '2': 'DOUBLE BOGEY', '3': 'TRIPLE BOGEY' };
function shotName(s) { return SHOT_NAME[String(s)] || ('+' + s); }

function roundTitle(shots) {
  if (shots <= -4) return 'CLUB CHAMPION';
  if (shots <= -1) return 'UNDER PAR';
  if (shots === 0) return 'PAR';
  if (shots <= 5) return 'BOGEY GOLFER';
  return 'WEEKEND HACKER';
}

function roundTotals(save) {
  var secs = 0, shots = 0, played = 0;
  for (var i = 0; i < save.cards.length; i++) {
    var c = save.cards[i];
    if (!c) continue;
    played++; secs += c.net; shots += c.shots;
  }
  return { secs: secs, shots: shots, played: played, complete: played === save.cards.length };
}

// ---- states ---------------------------------------------------------------------
function startCourse(i) {
  APP.course = i;
  APP.run = newRun(getCourse(i), 0);
  APP.cam = newCam(APP.run.ball);
  APP.acc = 0;
  APP.state = 'PLAY';
}

// Quitting mid-course loses that course and restarts it from the first flag, and must not
// rewind the round pointer past a course already cleared.
function quitToMenu() {
  APP.iris = null;                  // quitting DURING the iris must cancel it, or the
  APP.run = null;                   // callback fires against a run that no longer exists
  APP.state = 'MENU';
  APP.menuIdx = hasProgress(APP.save) ? 0 : 1;
}

function bankCourse() {
  var run = APP.run, c = run.course;
  // The card banks the EXACT credit, not the drained one: hole out half a second after
  // the last flag and the two disagree, and the card is the one that has to be right.
  var net = netTime(run);
  var shots = timeShots(net, c.parTime);
  var prev = APP.save.cards[APP.course];
  if (!prev || net < prev.net) APP.save.cards[APP.course] = { net: net, shots: shots };
  if (APP.course + 1 < courseCount())
    APP.save.unlocked = Math.max(APP.save.unlocked, APP.course + 2);
  APP.save.pointer = Math.max(APP.save.pointer, Math.min(courseCount() - 1, APP.course + 1));
  writeSave(APP.save);
  APP.lastCard = { name: c.name, clock: run.clock, credit: run.credit, net: net,
                   shots: shots, par: c.parTime, flags: run.flagsHit.slice() };
  APP.state = 'CARD';
}

function irisOut(cx, cy, cb) { APP.iris = { mode: 'out', t: 0, cx: cx, cy: cy, cb: cb }; }
function irisIn(cx, cy) { APP.iris = { mode: 'in', t: 0, cx: cx, cy: cy, cb: null }; }

function advanceFromCard() {
  var next = APP.course + 1;
  if (next >= courseCount()) { APP.state = 'ROUND'; return; }
  startCourse(next);
  irisIn(W / 2, H / 2);
}

// ---- the frame ------------------------------------------------------------------
function stepApp(dt) {
  if (APP.toast > 0) APP.toast -= dt;

  if (APP.state === 'LOADING') {
    // One course per frame, so the first paint is immediate and the page never looks hung.
    getCourse(APP.loadIdx++);
    if (APP.loadIdx >= courseCount()) {
      APP.state = 'MENU';
      APP.menuIdx = hasProgress(APP.save) ? 0 : 1;
    }
    return;
  }

  if (APP.iris) {
    APP.iris.t += dt;
    if (APP.iris.t >= IRIS_TIME) {
      var cb = APP.iris.cb;
      APP.iris = null;
      if (cb) cb();
    }
  }

  // Any state that needs a run and has none falls back to MENU rather than throwing
  // inside the frame loop.
  if ((APP.state === 'PLAY' || APP.state === 'PAUSE') && !APP.run) { quitToMenu(); return; }
  if (APP.state !== 'PLAY') return;

  var run = APP.run;
  var inp = (run.holdT > 0 || run.ball.state !== ST.ROLL) ? [0, 0] : inputVector(APP.keys);

  APP.acc += dt;
  var steps = 0;
  while (APP.acc >= DT && steps < 8) { tick(run, inp[0], inp[1]); APP.acc -= DT; steps++; }
  // A tab that was backgrounded must not try to catch up on four thousand ticks.
  if (APP.acc > DT * 8) APP.acc = 0;

  playEvents(run);
  updateCamera(APP.cam, run.ball, dt);

  if (run.ball.state === ST.HOLED && run.holeT >= 1.0 && !APP.iris && APP.state === 'PLAY') {
    var c = run.course.cup;
    irisOut(projX(APP.cam, c.x, c.y), projY(APP.cam, c.x, c.y, c.z), function () {
      if (APP.state === 'PLAY') bankCourse();
    });
  }
}

// ---- keys -------------------------------------------------------------------------
// The state decides what a key means BEFORE the movement map does. Claiming arrows for
// steering first is what made every menu cursor immovable: ArrowDown set `keys.down` and
// returned, and the menu never saw it.
function onKeyDown(code, shift, ctrl) {
  if (code === 'KeyM') { APP.muted = !APP.muted; setMuted(APP.muted); toast(APP.muted ? 'MUTED' : 'SOUND ON'); return true; }
  if (code === 'F3') { APP.perf = !APP.perf; APP.perfWorst = 0; return true; }

  if (APP.state === 'PLAY') {
    if (KEYMAP[code]) { APP.keys[KEYMAP[code]] = true; return true; }
    if (code === 'Escape') { APP.state = 'PAUSE'; APP.menuIdx = 0; APP.keys = {}; return true; }
    return false;
  }
  APP.keys = {};              // no other screen holds movement state

  if (APP.state === 'MENU') return menuKey(code, shift, ctrl) || !!KEYMAP[code];
  if (APP.state === 'SELECT') return selectKey(code) || !!KEYMAP[code];
  if (APP.state === 'VIEWCARD' || APP.state === 'ROUND') {
    if (code === 'Escape' || code === 'Enter' || code === 'Space') {
      if (APP.state === 'ROUND') { APP.save.pointer = 0; writeSave(APP.save); }
      APP.state = 'MENU'; return true;
    }
    return false;
  }
  if (APP.state === 'CARD') {
    if (code === 'Enter' || code === 'Space') { advanceFromCard(); return true; }
    if (code === 'Escape') { quitToMenu(); return true; }
    return false;
  }
  if (APP.state === 'PAUSE') return pauseKey(code) || !!KEYMAP[code];
  return !!KEYMAP[code];      // swallow arrows on any screen, so the page never scrolls
}

function onKeyUp(code) {
  if (KEYMAP[code]) { APP.keys[KEYMAP[code]] = false; return true; }
  return false;
}

function toast(s) { APP.toastText = s; APP.toast = 1.4; }

var MENU_ITEMS = ['CONTINUE', 'NEW ROUND', 'COURSE SELECT', 'SCORECARD', 'ERASE SAVE'];

function menuKey(code, shift, ctrl) {
  if (ctrl && shift && code === 'KeyU') {
    // The only fast path to the win state, and the recording needs one. It seeds each
    // untouched card with its own par, so the round scorecard is one course away.
    APP.save.unlocked = courseCount();
    for (var i = 0; i < courseCount(); i++)
      if (!APP.save.cards[i]) APP.save.cards[i] = { net: getCourse(i).parTime, shots: 0 };
    APP.save.pointer = courseCount() - 1;
    writeSave(APP.save);
    toast('ALL COURSES UNLOCKED');
    return true;
  }
  if (code === 'ArrowUp' || code === 'KeyW') { APP.menuIdx = (APP.menuIdx + 4) % 5; return true; }
  if (code === 'ArrowDown' || code === 'KeyS') { APP.menuIdx = (APP.menuIdx + 1) % 5; return true; }
  if (code !== 'Enter' && code !== 'Space') return false;
  var pick = MENU_ITEMS[APP.menuIdx];
  if (pick === 'CONTINUE') {
    if (!hasProgress(APP.save)) return true;
    startCourse(Math.min(APP.save.pointer, APP.save.unlocked - 1));
    irisIn(W / 2, H / 2);
  } else if (pick === 'NEW ROUND') {
    APP.save = blankSave(courseCount());
    writeSave(APP.save);
    startCourse(0);
    irisIn(W / 2, H / 2);
  } else if (pick === 'COURSE SELECT') {
    APP.state = 'SELECT'; APP.selIdx = 0;
  } else if (pick === 'SCORECARD') {
    APP.state = 'VIEWCARD';
  } else {
    APP.save = blankSave(courseCount());
    eraseSave();
    APP.menuIdx = 1;
    toast('SAVE ERASED');
  }
  return true;
}

function selectKey(code) {
  if (code === 'ArrowUp' || code === 'KeyW') { APP.selIdx = (APP.selIdx + courseCount() - 1) % courseCount(); return true; }
  if (code === 'ArrowDown' || code === 'KeyS') { APP.selIdx = (APP.selIdx + 1) % courseCount(); return true; }
  if (code === 'Escape') { APP.state = 'MENU'; return true; }
  if (code !== 'Enter' && code !== 'Space') return false;
  if (APP.selIdx >= APP.save.unlocked) { toast('LOCKED'); return true; }
  startCourse(APP.selIdx);
  irisIn(W / 2, H / 2);
  return true;
}

var PAUSE_ITEMS = ['RESUME', 'RESTART COURSE', 'QUIT TO MENU'];
function pauseKey(code) {
  if (code === 'Escape') { APP.state = 'PLAY'; return true; }
  if (code === 'ArrowUp' || code === 'KeyW') { APP.menuIdx = (APP.menuIdx + 2) % 3; return true; }
  if (code === 'ArrowDown' || code === 'KeyS') { APP.menuIdx = (APP.menuIdx + 1) % 3; return true; }
  if (code !== 'Enter' && code !== 'Space') return false;
  if (APP.menuIdx === 0) APP.state = 'PLAY';
  else if (APP.menuIdx === 1) startCourse(APP.course);
  else quitToMenu();
  return true;
}

/* ===== src/ui.js ===== */
// UI — the HUD and the eight screens. Everything here draws; nothing here decides.

var FONT = 'monospace';
function txt(ctx, s, x, y, size, col, align, weight) {
  ctx.font = (weight || '') + ' ' + Math.round(size) + 'px ' + FONT;
  ctx.fillStyle = col;
  ctx.textAlign = align || 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.fillText(s, x, y);
  RSTAT.fills++;
}

function panel(ctx, x, y, w, h, a) {
  ctx.fillStyle = 'rgba(14,12,20,' + (a === undefined ? 0.82 : a) + ')';
  ctx.fillRect(x, y, w, h);
  RSTAT.fills++;
  ctx.strokeStyle = 'rgba(246,241,226,0.22)'; ctx.lineWidth = 2;
  ctx.strokeRect(x, y, w, h);
  RSTAT.strokes++;
}

function clockStr(s) {
  if (s < 0) s = 0;
  var m = Math.floor(s / 60), r = s - m * 60;
  return (m < 10 ? '0' : '') + m + ':' + (r < 10 ? '0' : '') + r.toFixed(1);
}

// ---- the HUD --------------------------------------------------------------------
function drawHUD(ctx, run) {
  var c = run.course;
  // Top right, counting up, measured in SIMULATION TICKS, never off a wall clock, so a
  // slow frame cannot cost the player a second.
  var shown = Math.max(0, run.clock - run.creditShown);
  txt(ctx, clockStr(shown), W - 26, 62, 46, '#f6f1e2', 'right', 'bold');
  txt(ctx, 'PAR ' + c.parTime.toFixed(0) + 's', W - 26, 88, 18, 'rgba(246,241,226,0.55)', 'right');

  // The credit DRAINS with a receipt beside it rather than jumping — a number that jumps
  // reads as a glitch.
  if (run.receipt > 0) {
    var a = Math.min(1, run.receipt / 0.35);
    txt(ctx, '-' + run.receiptVal.toFixed(1) + 's', W - 190, 62, 30,
        'rgba(120,230,150,' + a.toFixed(2) + ')', 'right', 'bold');
  }

  txt(ctx, c.name, 26, 46, 24, '#f6f1e2', 'left', 'bold');
  txt(ctx, 'COURSE ' + (APP.course + 1) + ' OF ' + courseCount(), 26, 70, 16,
      'rgba(246,241,226,0.55)');

  // Flags claimed, as flags.
  for (var i = 0; i < c.flags.length; i++) {
    var x = 28 + i * 26, y = 96;
    ctx.beginPath();
    ctx.moveTo(x, y); ctx.lineTo(x, y - 22);
    ctx.strokeStyle = 'rgba(246,241,226,0.7)'; ctx.lineWidth = 2; RSTAT.strokes++; ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x, y - 22); ctx.lineTo(x + 14, y - 17); ctx.lineTo(x, y - 12);
    ctx.closePath();
    ctx.fillStyle = run.flagsHit[i] ? COL_FLAG : 'rgba(246,241,226,0.18)';
    RSTAT.fills++; ctx.fill();
  }

  // BALL LOST — the lose state, named. Not a screen: a price.
  if (run.banner) {
    var b = run.banner;
    var al = Math.min(1, b.t / 0.3);
    var label = b.cause === 'water' ? 'WATER' : (b.cause === 'eaten' ? 'EATEN' : 'VOID');
    ctx.save();
    ctx.globalAlpha = al;
    panel(ctx, W / 2 - 220, H * 0.30, 440, 74, 0.80);
    txt(ctx, 'BALL LOST — ' + label, W / 2, H * 0.30 + 48, 36, COL_FLAG, 'center', 'bold');
    ctx.restore();
  }

  if (run.holdT > 0) {
    txt(ctx, 'RESPAWNING  ' + run.holdT.toFixed(1), W / 2, H * 0.30 + 118, 20,
        'rgba(246,241,226,0.75)', 'center');
  }

  // The only tutorial there is: ten seconds on course 1, fading over the last three.
  if (APP.course === 0 && run.clock < 10) {
    var f = run.clock > 7 ? (10 - run.clock) / 3 : 1;
    ctx.save(); ctx.globalAlpha = f;
    txt(ctx, 'W A S D  —  ACCELERATE, NEVER STEER.  BRAKE EARLY, TURN LATE.',
        W / 2, H - 46, 22, '#f6f1e2', 'center', 'bold');
    ctx.restore();
  }

  if (APP.toast > 0) txt(ctx, APP.toastText, W / 2, 40, 20, '#f6f1e2', 'center');

  // F3: what the frame cost US and what the browser actually DELIVERED, plus the worst
  // gap since it was switched on. An average hides exactly the frames being complained about.
  if (APP.perf) {
    var y2 = H - 128;
    panel(ctx, 20, y2, 268, 108, 0.72);
    txt(ctx, 'ours   ' + APP.perfNow.toFixed(2) + ' ms', 34, y2 + 30, 17, '#9fe8b0');
    txt(ctx, 'frame  ' + APP.perfFrame.toFixed(2) + ' ms', 34, y2 + 52, 17, '#9fe8b0');
    txt(ctx, 'worst  ' + APP.perfWorst.toFixed(2) + ' ms', 34, y2 + 74, 17, '#ffa63a');
    txt(ctx, 'fills ' + RSTAT.fills + '  strokes ' + RSTAT.strokes, 34, y2 + 96, 15,
        'rgba(246,241,226,0.6)');
  }
}

// ---- the iris -------------------------------------------------------------------
function drawIris(ctx) {
  var ir = APP.iris;
  if (!ir) return;
  var q = Math.min(1, ir.t / IRIS_TIME);
  var r = Math.hypot(W, H) * (ir.mode === 'out' ? (1 - q) : q);
  ctx.beginPath();
  ctx.rect(0, 0, W, H);
  ctx.arc(ir.cx, ir.cy, Math.max(0, r), 0, Math.PI * 2, true);
  ctx.fillStyle = '#0a0a10';
  RSTAT.fills++; ctx.fill('evenodd');
}

// ---- the screens ------------------------------------------------------------------
function menuBg(ctx) {
  var gr = ctx.createLinearGradient(0, 0, 0, H);
  gr.addColorStop(0, 'rgb(30,26,42)');
  gr.addColorStop(0.55, 'rgb(20,18,30)');
  gr.addColorStop(1, 'rgb(10,9,16)');
  ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H); RSTAT.fills++;
  txt(ctx, 'PAPER LINKS', W / 2, 190, 78, '#f6f1e2', 'center', 'bold');
  txt(ctx, 'BRAKE EARLY, TURN LATE', W / 2, 228, 22, 'rgba(255,93,93,0.85)', 'center');
}

function drawMenu(ctx) {
  menuBg(ctx);
  var can = hasProgress(APP.save);
  for (var i = 0; i < MENU_ITEMS.length; i++) {
    var on = i === APP.menuIdx;
    var grey = (i === 0 && !can);
    var col = grey ? 'rgba(246,241,226,0.25)' : (on ? '#ffa63a' : 'rgba(246,241,226,0.8)');
    txt(ctx, (on ? '▸ ' : '  ') + MENU_ITEMS[i], W / 2 - 130, 330 + i * 46, 28, col);
  }
  txt(ctx, 'WASD / ARROWS accelerate   ·   ESC pause   ·   M mute   ·   F3 frame times',
      W / 2, H - 96, 17, 'rgba(246,241,226,0.45)', 'center');
  txt(ctx, 'CTRL+SHIFT+U unlocks every course', W / 2, H - 68, 17,
      'rgba(246,241,226,0.30)', 'center');
  if (APP.toast > 0) txt(ctx, APP.toastText, W / 2, H - 130, 22, '#ffa63a', 'center', 'bold');
}

function drawSelect(ctx) {
  menuBg(ctx);
  txt(ctx, 'COURSE SELECT', W / 2, 292, 26, 'rgba(246,241,226,0.7)', 'center');
  for (var i = 0; i < courseCount(); i++) {
    var c = getCourse(i), on = i === APP.selIdx;
    var locked = i >= APP.save.unlocked;
    var col = locked ? 'rgba(246,241,226,0.25)' : (on ? '#ffa63a' : 'rgba(246,241,226,0.8)');
    var card = APP.save.cards[i];
    var line = (on ? '▸ ' : '  ') + (i + 1) + '  ' + c.name +
               (locked ? '   [LOCKED]' : '   ' + c.flags.length + ' FLAGS   PAR ' + c.parTime + 's');
    txt(ctx, line, W / 2 - 260, 340 + i * 40, 24, col);
    if (card && !locked)
      txt(ctx, clockStr(card.net) + '  ' + shotName(card.shots), W / 2 + 300, 340 + i * 40, 20,
          'rgba(159,232,176,0.85)', 'right');
  }
  txt(ctx, 'ESC back', W / 2, H - 80, 18, 'rgba(246,241,226,0.45)', 'center');
  if (APP.toast > 0) txt(ctx, APP.toastText, W / 2, H - 120, 22, '#ffa63a', 'center', 'bold');
}

function drawPause(ctx) {
  panel(ctx, W / 2 - 210, H / 2 - 130, 420, 260, 0.88);
  txt(ctx, 'PAUSED', W / 2, H / 2 - 74, 36, '#f6f1e2', 'center', 'bold');
  for (var i = 0; i < PAUSE_ITEMS.length; i++)
    txt(ctx, (i === APP.menuIdx ? '▸ ' : '  ') + PAUSE_ITEMS[i], W / 2 - 130,
        H / 2 - 12 + i * 44, 26, i === APP.menuIdx ? '#ffa63a' : 'rgba(246,241,226,0.8)');
}

function drawCard(ctx) {
  var c = APP.lastCard;
  if (!c) { APP.state = 'MENU'; return; }
  panel(ctx, W / 2 - 320, H / 2 - 190, 640, 380, 0.90);
  txt(ctx, c.name, W / 2, H / 2 - 132, 34, '#f6f1e2', 'center', 'bold');
  var rows = [
    ['TIME', clockStr(c.clock)],
    ['CHECKPOINTS', c.flags.filter(Boolean).length + ' / ' + c.flags.length +
                    '   −' + c.credit.toFixed(1) + 's'],
    ['NET', clockStr(c.net)],
    ['PAR', clockStr(c.par)],
  ];
  for (var i = 0; i < rows.length; i++) {
    txt(ctx, rows[i][0], W / 2 - 260, H / 2 - 70 + i * 42, 22, 'rgba(246,241,226,0.6)');
    txt(ctx, rows[i][1], W / 2 + 260, H / 2 - 70 + i * 42, 24, '#f6f1e2', 'right');
  }
  var col = c.shots < 0 ? '#9fe8b0' : (c.shots === 0 ? '#f6f1e2' : '#ffa63a');
  txt(ctx, shotName(c.shots), W / 2, H / 2 + 132, 48, col, 'center', 'bold');
  txt(ctx, APP.course + 1 < courseCount() ? 'ENTER  next course' : 'ENTER  round scorecard',
      W / 2, H / 2 + 172, 18, 'rgba(246,241,226,0.5)', 'center');
}

// THE WIN STATE. Six courses added twice — in seconds, and in shots to par, which is the
// only form a round adds up in.
function drawRound(ctx, viewing) {
  menuBg(ctx);
  var t = roundTotals(APP.save);
  txt(ctx, viewing ? 'SCORECARD' : 'ROUND COMPLETE', W / 2, 292, 30,
      'rgba(246,241,226,0.75)', 'center');
  for (var i = 0; i < courseCount(); i++) {
    var c = getCourse(i), card = APP.save.cards[i];
    var y = 340 + i * 38;
    txt(ctx, (i + 1) + '  ' + c.name, W / 2 - 300, y, 22, 'rgba(246,241,226,0.85)');
    if (!card) { txt(ctx, '—', W / 2 + 300, y, 22, 'rgba(246,241,226,0.3)', 'right'); continue; }
    txt(ctx, clockStr(card.net), W / 2 + 130, y, 22, '#f6f1e2', 'right');
    txt(ctx, (card.shots > 0 ? '+' : '') + card.shots, W / 2 + 300, y, 22,
        card.shots < 0 ? '#9fe8b0' : (card.shots === 0 ? '#f6f1e2' : '#ffa63a'), 'right');
  }
  var yb = 340 + courseCount() * 38 + 18;
  ctx.strokeStyle = 'rgba(246,241,226,0.3)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(W / 2 - 300, yb - 22); ctx.lineTo(W / 2 + 300, yb - 22);
  RSTAT.strokes++; ctx.stroke();
  txt(ctx, 'TOTAL', W / 2 - 300, yb + 8, 24, '#f6f1e2', 'left', 'bold');
  txt(ctx, clockStr(t.secs), W / 2 + 130, yb + 8, 24, '#f6f1e2', 'right', 'bold');
  txt(ctx, (t.shots > 0 ? '+' : '') + t.shots, W / 2 + 300, yb + 8, 24, '#f6f1e2', 'right', 'bold');
  if (t.complete)
    txt(ctx, roundTitle(t.shots), W / 2, yb + 66, 44,
        t.shots <= -1 ? '#9fe8b0' : '#ffa63a', 'center', 'bold');
  txt(ctx, 'ENTER / ESC  menu', W / 2, H - 60, 18, 'rgba(246,241,226,0.45)', 'center');
}

function drawLoading(ctx) {
  menuBg(ctx);
  txt(ctx, 'COMPILING COURSES  ' + APP.loadIdx + ' / ' + courseCount(), W / 2, 340, 22,
      'rgba(246,241,226,0.6)', 'center');
}

// ---- the frame -------------------------------------------------------------------
function drawApp(ctx) {
  var s = APP.state;
  if (s === 'LOADING') { drawLoading(ctx); return; }
  if (s === 'MENU') { drawMenu(ctx); drawIris(ctx); return; }
  if (s === 'SELECT') { drawSelect(ctx); return; }
  if (s === 'VIEWCARD') { drawRound(ctx, true); return; }
  if (s === 'ROUND') { drawRound(ctx, false); return; }
  if (!APP.run) { drawMenu(ctx); return; }
  drawWorld(ctx, APP.run, APP.cam);
  drawHUD(ctx, APP.run);
  if (s === 'PAUSE') drawPause(ctx);
  if (s === 'CARD') drawCard(ctx);
  drawIris(ctx);
}

/* ===== src/main.js ===== */
// MAIN — the browser entry. The only file that touches the DOM.
//
// Everything above this line runs headlessly under Node in the suite, which is the whole
// point of keeping the simulation pure: rendering is never proof.

function bootPaperLinks() {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d', { alpha: false });

  APP.save = loadSave(courseCount());

  window.addEventListener('keydown', function (e) {
    // The audio graph is built on the first key, which is the gesture browsers want.
    ensureAudio();
    if (onKeyDown(e.code, e.shiftKey, e.ctrlKey || e.metaKey)) e.preventDefault();
  });
  window.addEventListener('keyup', function (e) {
    if (onKeyUp(e.code)) e.preventDefault();
  });
  window.addEventListener('blur', function () { APP.keys = {}; });

  function frame(ts) {
    window.requestAnimationFrame(frame);
    var dt = APP.last < 0 ? 0 : (ts - APP.last) / 1000;
    APP.last = ts;
    if (!isFinite(dt) || dt < 0) dt = 0;
    if (dt > 0.25) dt = 0.25;                  // clamp before the accumulator sees it
    APP.perfFrame = dt * 1000;

    var t0 = ts;
    stepApp(dt);
    drawApp(ctx);
    var spent = (window.performance ? window.performance.now() : ts) - t0;
    APP.perfNow = spent;
    var gap = Math.max(spent, APP.perfFrame);
    if (APP.perf && gap > APP.perfWorst) APP.perfWorst = gap;
  }
  window.requestAnimationFrame(frame);
}

if (typeof document !== 'undefined' && typeof window !== 'undefined') bootPaperLinks();

</script>
