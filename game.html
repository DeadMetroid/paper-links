<body>
<canvas id="c" width="1280" height="900"></canvas>
<script>
"use strict";
/* ===== src/tuning.js ===== */
// EVERY NUMBER IN THE GAME LIVES HERE AND NOWHERE ELSE.
//
// These are measured facts, not preferences. Changing one requires re-measuring it.
// Where a value is DERIVED it is computed here, never typed — typing a derived number
// is how it drifts away from the thing it was derived from.

// ---- physics ----------------------------------------------------------------
var G          = 30;        // gravity, world units/s^2
var ROLL       = 5 / 7;     // solid-sphere rolling factor, 1/(1 + I/mR^2), I = (2/5)mR^2
var K          = 9.0;       // player input acceleration, units/s^2      (LAW 5.1: LOW)
var MU         = 0.32;      // base linear rolling drag, per second      (LAW 5.1: LOW)
var E          = 0.35;      // restitution — papercraft is dead, not bouncy
var MAX_SPEED  = 26;        // hard horizontal speed clamp, applied EVERY tick
var BALL_R     = 0.32;      // ball radius in tiles
var DT         = 1 / 120;   // fixed simulation timestep
var AIR_INPUT  = 0.25;      // fraction of K available while airborne
var EPS        = 1e-4;      // launch-test epsilon
var CONTACT    = 0.02;      // separation below which the ball still feels the ground
var WALL_STEP  = 0.8;       // units a falling ball may rise onto on landing
var FALL_TIME  = 0.9;       // seconds of visible fall before the respawn resolves
var FALL_DRIFT = 0.35;      // fraction of horizontal speed kept once falling
var RESPAWN_HOLD = 2.0;     // seconds after a respawn before input is answered
var SINK_RATE  = 1.6;       // units/s the ball settles once in water
var SINK_TIME  = 1.0;       // seconds from touching water to the respawn
var FLAT_DRAG  = 3.4;       // drag multiplier while flattened
var BREAK_TIME = 0.55;      // seconds a fragile tile holds after first touch
var BELT_SPEED = 11;        // units/s a belt will carry a ball along itself
var BELT_ACC   = 14;        // units/s^2 it closes the gap at
var RIVAL_DRAG = 1.2, RIVAL_KNOCK = 0.7, RIVAL_DOWN = 2.6;
var SEEK_LOOK  = 1.3,  SEEK_CLEAR = 0.45;
var CAM_LEAD   = 0.35, CAM_SMOOTH = 6.0;
var SQUASH_DECAY = 0.12, IMPACT_MIN = 1.5, IMPACT_REF = 12;
var VTERM_MAX  = 2.0;       // max terminal speed permitted at a flag or a tee (test 5)

// DERIVED, never typed. The steepness above which input cannot arrest the ball.
var SLOPE_CRIT = K / (ROLL * G);                                   // = 0.42

// ---- the level compiler -----------------------------------------------------
var VOID_DEPTH = 40;        // how far below the lowest surface the void floor sits
var DEATH_DROP = 4;         // course.deathZ = lowestSurface - this
var SEAM_TOL   = 0.02;      // corner disagreement over this is a reported seam

// ---- checkpoints (section 10) ----------------------------------------------
var GATE_R_MIN = 1.1;       // no trigger is ever smaller than this
var GATE_MARGIN = 0.2;      // slack past the furthest a ball's centre can be
var NECK_MAX   = 4.2;       // paper across the run at a flag may not exceed this
var CUP_CLEAR  = 14;        // tiles of route a flag must leave still to drive
var FLAG_RAISE = 0.8;       // seconds a claimed flag takes to raise

// ---- the clock (section 11) -------------------------------------------------
var CREDIT_DRAIN = 9;       // s/s the HUD drains a checkpoint's credit at
var RECEIPT_TIME = 1.6;     // seconds the "-3.0s" receipt stays beside the clock
var BANNER_TIME  = 1.6;     // seconds the BALL LOST banner holds

// ---- the view — DERIVED, never chosen (section 5) ---------------------------
// The camera must see at least MAX_SPEED*1.2 world units ahead of the ball on flat
// ground or the reaction-time budget is unsatisfiable. Screen-vertical advances
// sqrt(2)/4 * TILE px per world unit of descent. Pick TILE first and you have chosen
// the difficulty by accident.
var W = 1280, H = 900, BALL_Y = 0.38;
var AHEAD_PX = H * (1 - BALL_Y);                                   // = 558
var TILE     = Math.floor(AHEAD_PX / ((Math.SQRT2 / 4) * MAX_SPEED * 1.2));   // = 50
var Z_SCALE  = Math.round(TILE * 0.36);                            // = 18
var Z_BAND   = (TILE / 2) / Z_SCALE;                               // = 1.389 bands/unit

// ---- rendering (section 12) -------------------------------------------------
var SHADES     = 12;
var SHADE_LO   = 0.34, SHADE_HI = 0.92;   // LAW 12.1: the lambda band the game occupies
var PROP_BIAS  = 1.5;                     // bands a ground-standing prop sorts behind by
var BALL_REACH = 3;                       // tiles the ball's depth ray walks
var BALL_STEP  = 0.1;                     // and the stride it walks them in
var CUP_DEPTH  = 1.6;                     // world units the cup shaft drops
var HOLE_TIME  = 0.7, HOLE_SETTLE = 0.3;  // seconds; the settle is inside the drop
var IRIS_TIME  = 0.55;
var WALL_BOTTOM = H + 40;                 // ABSOLUTE screen px, not an offset
var WALL_CREASE = 13;                     // world units a vertical crease runs down

// Cull margins. Settled by hashing posed frames, not by arithmetic — that bound was got
// wrong twice by reasoning about it. Do not re-derive these.
var CELL_SPREAD = 3;                                   // measured worst across six: 1.23
var CELL_UP     = CELL_SPREAD * Z_SCALE + TILE;        // = 104 px
var CELL_DOWN   = TILE / 2 + CELL_SPREAD * Z_SCALE + TILE;  // = 129 px
var CELL_SIDE   = 200;    // a no-op; every value tried below it moved pixels. Leave it.
var PROP_PAD_X = 300, PROP_PAD_TOP = 400, PROP_PAD_BOTTOM = 260;

// ---- audio (section 13) -----------------------------------------------------
var ROLL_LO = 420, ROLL_HI = 2700;        // Hz the bandpass centre runs between
var NOISE_SECONDS = 2;                    // seeded loop length

// ---- surfaces ---------------------------------------------------------------
var SURF = {
  FAIRWAY: 0, GREEN: 1, ROUGH: 2, SAND: 3,
  WATER: 4, BELT: 5, FRAGILE: 6, CRACKED: 7,
};
// The first five differ only by drag. The last three carry RULES, which is what a drag
// coefficient cannot buy.
var SURF_DRAG = [1.0, 0.55, 2.6, 6.0, 1.4, 1.0, 1.0, 1.0];
var SURF_NAME = ['FAIRWAY', 'GREEN', 'ROUGH', 'SAND', 'WATER', 'BELT', 'FRAGILE', 'CRACKED'];

// Colour is identity. Two accent colours carrying sixteen objects is what this replaced.
var SURF_RGB = [
  [168, 213, 162],  // FAIRWAY
  [198, 232, 178],  // GREEN
  [124, 165, 122],  // ROUGH
  [239, 219, 172],  // SAND
  [96, 168, 214],   // WATER
  [201, 178, 142],  // BELT
  [226, 228, 208],  // FRAGILE
  [184, 158, 138],  // CRACKED
];
var COL_EDGE = '#f6f1e2';   // fold lines
var COL_FLAG = '#ff5d5d';
var COL_WARN = '#ffa63a';   // painted ON THE GROUND, and ONLY under something that moves

// The light direction, shared by the terrain, the ball and every prop.
var LIGHT = (function () {
  var l = [-0.5, -0.8, 1.0], m = Math.hypot(l[0], l[1], l[2]);
  return [l[0] / m, l[1] / m, l[2] / m];
})();

// ---- ball states ------------------------------------------------------------
var ST = { ROLL: 0, FALL: 1, SINK: 2, HOLED: 3 };

/* ===== src/heightfield.js ===== */
// The lattice. Heights live on CORNERS and are shared between neighbouring cells; the
// mask, the surface and the belt flow live on CELLS.
//
// LAW 5.3 — the mask says where the ground is; the height field never does. The grid
// holds a height for void cells because the array is rectangular.
// LAW 6.4 — bounds-check on each AXIS, never on the flat index. `j*nx + i` with `i` past
// the right-hand edge is a valid offset — it is the next row.

function makeGrid(nx, ny, ox, oy) {
  return {
    nx: nx, ny: ny, ox: ox, oy: oy,
    h: new Float64Array((nx + 1) * (ny + 1)),   // corner heights
    hp: new Uint8Array((nx + 1) * (ny + 1)),    // corner painted? (drives the dilation)
    solid: new Uint8Array(nx * ny),
    surf: new Uint8Array(nx * ny),
    fx: new Float64Array(nx * ny),              // belt flow
    fy: new Float64Array(nx * ny),
  };
}

// A per-run copy: the mask and the surfaces are the run's (LAW 10.6, fragile paper is
// restored on respawn), the heights and the flow are fixed for the life of the level and
// are shared by reference. The compiled course grid is NEVER written to.
function forkGrid(g) {
  return {
    nx: g.nx, ny: g.ny, ox: g.ox, oy: g.oy,
    h: g.h, hp: g.hp, fx: g.fx, fy: g.fy,
    solid: g.solid.slice(),
    surf: g.surf.slice(),
  };
}

function cellIndex(g, wx, wy) {
  var i = Math.floor(wx - g.ox), j = Math.floor(wy - g.oy);
  if (i < 0 || i >= g.nx) return -1;            // per AXIS
  if (j < 0 || j >= g.ny) return -1;
  return j * g.nx + i;
}

function solidAt(g, wx, wy) {
  var k = cellIndex(g, wx, wy);
  return k < 0 ? 0 : g.solid[k];
}

function surfAt(g, wx, wy) {
  var k = cellIndex(g, wx, wy);
  return k < 0 ? SURF.FAIRWAY : g.surf[k];
}

function surfDragAt(g, wx, wy) {
  return SURF_DRAG[surfAt(g, wx, wy)];
}

function flowAt(g, wx, wy, out) {
  var k = cellIndex(g, wx, wy);
  out[0] = k < 0 ? 0 : g.fx[k];
  out[1] = k < 0 ? 0 : g.fy[k];
  return out;
}

// GROUND, for the checkpoint measurements. Water is not ground: contact with it is a
// loss, so a ball can no more stand on it than on the void. That is what lets a dry SLOT
// through a band of water be a neck (LAW 10.1).
function groundAt(g, wx, wy) {
  var k = cellIndex(g, wx, wy);
  if (k < 0) return 0;
  if (!g.solid[k]) return 0;
  return g.surf[k] === SURF.WATER ? 0 : 1;
}

function cornerAt(g, i, j) {
  var ii = i < 0 ? 0 : (i > g.nx ? g.nx : i);
  var jj = j < 0 ? 0 : (j > g.ny ? g.ny : j);
  return g.h[jj * (g.nx + 1) + ii];
}

function heightAt(g, wx, wy) {
  var fx = wx - g.ox, fy = wy - g.oy;
  var i = Math.floor(fx), j = Math.floor(fy);
  var tx = fx - i, ty = fy - j;
  var h00 = cornerAt(g, i, j),     h10 = cornerAt(g, i + 1, j);
  var h01 = cornerAt(g, i, j + 1), h11 = cornerAt(g, i + 1, j + 1);
  return (h00 * (1 - tx) + h10 * tx) * (1 - ty) + (h01 * (1 - tx) + h11 * tx) * ty;
}

// Central difference half a tile either side — separation is one full tile, so the
// divisor is 1. On the last solid cell of a lip this samples the DILATION, which is why
// the compiler runs it two rings past the paper: without it this reads void filler 40
// units down, reports a slope of -18, and the launch test converts that into 300 units/s
// straight down. The ball vanishes at the edge instead of flying off it.
function gradAt(g, wx, wy, out) {
  out[0] = heightAt(g, wx + 0.5, wy) - heightAt(g, wx - 0.5, wy);
  out[1] = heightAt(g, wx, wy + 0.5) - heightAt(g, wx, wy - 0.5);
  return out;
}

function gradMag(g, wx, wy) {
  var t = [0, 0];
  gradAt(g, wx, wy, t);
  return Math.hypot(t[0], t[1]);
}

// Paper standing more than WALL_STEP above the ball is a cliff beside it, not ground it
// is about to land on (LAW 5.4). This is the one test that stops a falling ball climbing
// the tier it just fell off.
function wallAt(g, wx, wy, z) {
  return solidAt(g, wx, wy) === 1 && heightAt(g, wx, wy) > z + WALL_STEP;
}

// The isometric projection, exactly. Not to be rewritten once it works (LAW 4.x).
function projX(cam, wx, wy) {
  return (wx - wy - (cam.x - cam.y)) * (TILE / 2) + W / 2;
}
function projY(cam, wx, wy, wz) {
  return (wx + wy - (cam.x + cam.y)) * (TILE / 4)
       - (wz - cam.z) * Z_SCALE + H * BALL_Y;
}

/* ===== src/physics.js ===== */
// PHYSICS — a rolling solid sphere on a bilinearly interpolated heightfield.
// Fixed timestep, semi-implicit Euler, fully deterministic, no wall clock anywhere.
//
// Nothing in this file reads the renderer, the DOM, or Date. It is driven headlessly by
// the suite and by the fairness oracle, and rendering is never proof.

var _g0 = [0, 0], _g1 = [0, 0];   // scratch, so the tick allocates nothing

function newBall(x, y, z) {
  return {
    x: x, y: y, z: z, vx: 0, vy: 0, vz: 0,
    air: false, lift: 0, state: ST.ROLL,
    spin: 0, spinAxis: [1, 0],
    squash: 0, flat: 0, bank: 0, impact: 0,
    fallT: 0, sinkT: 0, cause: null,
  };
}

function newRun(course, routeIdx) {
  var g = forkGrid(course.grid);
  var sz = heightAt(g, course.start.x, course.start.y);
  var run = {
    course: course,
    grid: g,
    routeIdx: routeIdx | 0,
    t: 0,                 // simulation time; hazard phases read this
    clock: 0,             // counts UP from the tee (LAW 11.1). Never a budget.
    credit: 0,            // exact seconds paid back by checkpoints
    creditShown: 0,       // the drained display number — the card banks the exact one
    receipt: 0,           // seconds left on the "-3.0s" receipt
    receiptVal: 0,
    falls: 0,
    holdT: 0,             // RESPAWN_HOLD counting down; input is not answered
    banner: null,         // { cause, t } — BALL LOST, and what took it
    flagsHit: [],
    flagRaise: [],
    spawn: { x: course.start.x, y: course.start.y, z: sz },
    bodies: [],
    cracks: [],
    events: [],
    holeT: 0,
    ball: newBall(course.start.x, course.start.y, sz),
  };
  for (var i = 0; i < course.flags.length; i++) { run.flagsHit.push(false); run.flagRaise.push(0); }
  buildBodies(run);
  return run;
}

// The audio layer drains this every frame. A headless driver never does, so the list is
// capped rather than left to grow through a hundred thousand ticks.
function emit(run, kind, a, b) {
  if (run.events.length > 128) run.events.shift();
  run.events.push({ kind: kind, a: a, b: b });
}

function clampSpeed(b) {
  var s2 = b.vx * b.vx + b.vy * b.vy;
  if (s2 > MAX_SPEED * MAX_SPEED) {
    var k = MAX_SPEED / Math.sqrt(s2);
    b.vx *= k; b.vy *= k;
  }
}

function enterFall(run, cause) {
  var b = run.ball;
  if (b.state !== ST.ROLL) return;
  b.state = ST.FALL; b.fallT = 0; b.cause = cause;
  run.banner = { cause: cause, t: BANNER_TIME };
  emit(run, 'lost', cause);
}

function enterSink(run, cause) {
  var b = run.ball;
  if (b.state !== ST.ROLL) return;
  b.state = ST.SINK; b.sinkT = 0; b.cause = cause;
  run.banner = { cause: cause, t: BANNER_TIME };
  emit(run, cause === 'eaten' ? 'eaten' : 'splash', cause);
}

// LAW 10.6 — fragile ground is restored on respawn. A course that eats its own floor one
// attempt at a time eventually cannot be finished.
function respawn(run) {
  var b = run.ball, c = run.course;
  run.falls++;
  run.grid.solid.set(c.grid.solid);
  run.grid.surf.set(c.grid.surf);
  run.cracks.length = 0;
  b.x = run.spawn.x; b.y = run.spawn.y; b.z = run.spawn.z;
  b.vx = b.vy = b.vz = 0;
  b.state = ST.ROLL; b.air = false; b.lift = 0; b.flat = 0;
  b.squash = 0; b.fallT = 0; b.sinkT = 0; b.impact = 0;
  run.holdT = RESPAWN_HOLD;
  emit(run, 'respawn');
}

// LAW 10.4 — a trigger is a disc on the GROUND. Gate it on WALL_STEP against the
// TRIGGER'S OWN ground, never on the ball's lift: lift reads zero over the void, which is
// exactly where a jumped gate is.
function triggerHit(run, tx, ty, tr) {
  var b = run.ball;
  var dx = b.x - tx, dy = b.y - ty;
  if (dx * dx + dy * dy > tr * tr) return false;
  return b.z <= heightAt(run.grid, tx, ty) + WALL_STEP;
}

// LAW 5.5 — collision is relative-velocity, and a collider with a `mass` is a two-body
// impulse. Everything WITHOUT a mass is the world: an infinite mass that takes nothing
// back. This one branch is the entire rival marble.
function collideBodies(run) {
  var b = run.ball, list = run.bodies;
  for (var i = 0; i < list.length; i++) {
    var c = list[i];
    if (!c.active || !c.bumps) continue;    // a TRIGGER is a field, not a body
    if (b.z > c.z + c.h) continue;          // a collider only bites when the ball can meet it
    var dx = b.x - c.x, dy = b.y - c.y;
    var rr = c.r + BALL_R;
    var d2 = dx * dx + dy * dy;
    if (d2 >= rr * rr) continue;
    var d = Math.sqrt(d2);
    var nx, ny;
    if (d < 1e-9) { nx = 1; ny = 0; d = 1e-9; } else { nx = dx / d; ny = dy / d; }

    var hasMass = typeof c.mass === 'number';
    var share = hasMass ? c.mass / (c.mass + 1) : 1;

    var rel = (b.vx - c.vx) * nx + (b.vy - c.vy) * ny;
    if (rel < 0) {
      var J = -(1 + E) * rel * share;
      b.vx += J * nx; b.vy += J * ny;
      if (hasMass) {
        // Banked, not integrated: physics never moves a hazard, it only hands it a number.
        c.kx -= J * nx / c.mass; c.ky -= J * ny / c.mass;
        c.knock = RIVAL_KNOCK;
      }
      emit(run, 'knock', -rel);
    }
    var pen = rr - d;
    b.x += nx * pen * share; b.y += ny * pen * share;
    if (hasMass) { c.x -= nx * pen * (1 - share); c.y -= ny * pen * (1 - share); }

    if (c.flatten && b.flat <= 0) {
      b.flat = c.flatten; b.squash = 1;
      emit(run, 'flatten');
    }
  }
}

function tick(run, ix, iy) {
  var b = run.ball, g = run.grid, c = run.course;

  run.t += DT;
  if (b.state !== ST.HOLED) run.clock += DT;

  // The credit drain is in the SIMULATION, not the renderer, so a headless test can
  // assert the credit arrives (LAW 11.1). A number that jumps reads as a glitch.
  if (run.creditShown < run.credit)
    run.creditShown = Math.min(run.credit, run.creditShown + CREDIT_DRAIN * DT);
  if (run.receipt > 0) run.receipt -= DT;
  if (run.banner) { run.banner.t -= DT; if (run.banner.t <= 0) run.banner = null; }

  // The flag's raise animation is in the simulation for the same reason (LAW 10.5).
  for (var i = 0; i < run.flagRaise.length; i++)
    if (run.flagsHit[i] && run.flagRaise[i] < 1)
      run.flagRaise[i] = Math.min(1, run.flagRaise[i] + DT / FLAG_RAISE);

  for (var q = run.cracks.length - 1; q >= 0; q--) {
    var cr = run.cracks[q];
    cr.t -= DT;
    if (cr.t <= 0) { g.solid[cr.k] = 0; run.cracks.splice(q, 1); emit(run, 'collapse'); }
  }

  // Hazards keep moving during a respawn hold — that hold is also where a player reads
  // the pattern that just took them.
  stepBodies(run);

  if (b.state === ST.HOLED) { run.holeT += DT; return; }

  if (run.holdT > 0) {
    run.holdT -= DT;
    b.x = run.spawn.x; b.y = run.spawn.y; b.z = run.spawn.z;
    b.vx = b.vy = b.vz = 0; b.air = false; b.lift = 0;
    return;                                   // the rest of the world updates around it
  }

  if (b.state === ST.SINK) {
    b.sinkT += DT;
    b.z -= SINK_RATE * DT;
    b.vx *= 0.88; b.vy *= 0.88;
    b.x += b.vx * DT; b.y += b.vy * DT;
    if (b.sinkT >= SINK_TIME) respawn(run);
    return;
  }

  if (b.state === ST.FALL) {
    b.fallT += DT;
    b.vz -= G * DT;
    b.z += b.vz * DT;
    // LAW 5.4 — the wall rule still applies here. A falling ball with no mask test
    // drifts up to 64 units INSIDE solid paper.
    var fdx = b.vx * DT * FALL_DRIFT, fdy = b.vy * DT * FALL_DRIFT;
    if (wallAt(g, b.x + fdx, b.y, b.z)) b.vx = -E * b.vx; else b.x += fdx;
    if (wallAt(g, b.x, b.y + fdy, b.z)) b.vy = -E * b.vy; else b.y += fdy;
    if (b.fallT >= FALL_TIME) respawn(run);
    return;
  }

  // ---- the rolling tick, in order -------------------------------------------
  var im = Math.hypot(ix, iy);
  if (im > 1) { ix /= im; iy /= im; }

  var onPaper = solidAt(g, b.x, b.y) === 1;                  // the MASK, never the height
  var h = onPaper ? heightAt(g, b.x, b.y) : b.z;
  var gx = 0, gy = 0;
  if (onPaper) { gradAt(g, b.x, b.y, _g0); gx = _g0[0]; gy = _g0[1]; }
  var contact = onPaper && (!b.air || (b.z - h) <= CONTACT);

  if (b.flat > 0) { b.flat -= DT; ix = 0; iy = 0; b.squash = 1; }

  var ax, ay;
  if (!contact) {
    ax = K * AIR_INPUT * ix; ay = K * AIR_INPUT * iy;
    b.vz -= G * DT;
  } else {
    var drag = MU * surfDragAt(g, b.x, b.y) * (b.flat > 0 ? FLAT_DRAG : 1);
    ax = -ROLL * G * gx + K * ix - drag * b.vx;
    ay = -ROLL * G * gy + K * iy - drag * b.vy;
    if (surfAt(g, b.x, b.y) === SURF.BELT) {
      // Only the component ALONG the belt, closing the gap to BELT_SPEED and no
      // further — a conveyor, not a hill. A ball already faster is never slowed by it.
      flowAt(g, b.x, b.y, _g1);
      var along = b.vx * _g1[0] + b.vy * _g1[1];
      var need = (BELT_SPEED - along) / BELT_SPEED;
      if (need > 0) {
        var m = BELT_ACC * Math.min(1, need);
        ax += _g1[0] * m; ay += _g1[1] * m;
      }
    }
  }

  b.vx += ax * DT; b.vy += ay * DT;
  clampSpeed(b);

  var vzSurface = gx * b.vx + gy * b.vy;                     // rate the ground falls away
  var sp = Math.hypot(b.vx, b.vy);
  b.bank = sp > 1e-6 ? Math.abs(b.vx * gy - b.vy * gx) / sp : 0;   // gradient ACROSS travel

  var nx2 = b.x + b.vx * DT, ny2 = b.y + b.vy * DT;

  // TIER WALL (LAW 5.4) — paper standing more than WALL_STEP above an airborne ball is a
  // cliff beside it, not ground it is about to land on.
  if (!contact) {
    if (wallAt(g, nx2, ny2, b.z)) {
      var blx = wallAt(g, nx2, b.y, b.z);
      var bly = wallAt(g, b.x, ny2, b.z);
      if (blx) { nx2 = b.x; b.vx = -E * b.vx; }
      if (bly) { ny2 = b.y; b.vy = -E * b.vy; }
      if (!blx && !bly) {          // caught the corner diagonally: undo both, reflect both
        nx2 = b.x; ny2 = b.y; b.vx = -E * b.vx; b.vy = -E * b.vy;
      }
    }
  }
  b.x = nx2; b.y = ny2;
  if (!contact) b.z += b.vz * DT;

  var onPaperNew = solidAt(g, b.x, b.y) === 1;
  var hNew = onPaperNew ? heightAt(g, b.x, b.y) : b.z;
  if (onPaperNew && hNew > b.z + WALL_STEP) { onPaperNew = false; hNew = b.z; }

  if (contact) {
    if (!onPaperNew) {
      b.vz = vzSurface;                       // leaves the lip tangentially
    } else if (hNew < b.z + vzSurface * DT - EPS) {
      b.vz = vzSurface;                       // LAUNCH TEST
    } else {
      b.z = hNew; b.vz = 0;
    }
  } else if (onPaperNew && b.z <= hNew) {
    b.z = hNew;
    b.impact = -b.vz;
    b.vz = 0;
    if (b.impact > IMPACT_MIN) {
      b.squash = Math.min(1, b.impact / IMPACT_REF);
      emit(run, 'land', b.impact);
    }
  }

  // `air` and `lift` are two different questions and both are needed. The launch test
  // fires on ANY downward curvature, so `air` flickers on undulating ground by design —
  // it says which force set the next tick uses. `lift` is how far the ball actually is
  // off the ground, and a five-centimetre hop is not flight.
  b.air = !onPaperNew || (b.z - hNew) > CONTACT;
  b.lift = onPaperNew ? b.z - hNew : 0;

  if (!b.air && surfAt(g, b.x, b.y) === SURF.WATER) enterSink(run, 'water');

  // FRAGILE only arms when the ball is genuinely on it, so a ball that flies the patch
  // does not arm it. Touching turns the cell CRACKED; BREAK_TIME later it is a hole.
  if (b.state === ST.ROLL && b.lift < 0.25) {
    var k = cellIndex(g, b.x, b.y);
    if (k >= 0 && g.surf[k] === SURF.FRAGILE) {
      g.surf[k] = SURF.CRACKED;
      run.cracks.push({ k: k, t: BREAK_TIME });
      emit(run, 'crack');
    }
  }

  if (sp > 1e-6) { b.spinAxis[0] = b.vx / sp; b.spinAxis[1] = b.vy / sp; }
  b.spin = (b.spin + sp * DT / BALL_R) % (Math.PI * 2);
  if (b.squash > 0) b.squash = Math.max(0, b.squash - DT / SQUASH_DECAY);

  applyTriggers(run);
  collideBodies(run);
  clampSpeed(b);

  if (b.z < c.deathZ) enterFall(run, 'void');
  if (b.state !== ST.ROLL) return;

  // ---- triggers on the ground ------------------------------------------------
  for (var f = 0; f < c.flags.length; f++) {
    if (run.flagsHit[f]) continue;
    var fl = c.flags[f];
    if (triggerHit(run, fl.x, fl.y, fl.r)) {
      run.flagsHit[f] = true;
      run.credit += c.bonus;                  // a flag pays `bonus` seconds ONCE
      run.receipt = RECEIPT_TIME; run.receiptVal = c.bonus;
      run.spawn = { x: fl.x, y: fl.y, z: heightAt(g, fl.x, fl.y) };
      emit(run, 'flag', f);
    }
  }
  if (triggerHit(run, c.cup.x, c.cup.y, c.cup.r)) {
    b.state = ST.HOLED; run.holeT = 0;
    b.vx = b.vy = b.vz = 0;
    emit(run, 'cup');
  }
}

// Net time is clock - credit, clamped at zero. There is no failure state on it.
function netTime(run) { return Math.max(0, run.clock - run.credit); }

/* ===== src/level.js ===== */
// THE LEVEL MODEL — pieces painted on the lattice.
//
// LAW 6.1 — a level is an ORDERED LIST OF PIECES painted onto the world lattice, not a
// ribbon with a width. Later pieces win, for both height and mask, so authoring is: lay
// the big shapes down, then carve. Every run is along +wx or +wy, which satisfies LAW 4.1
// by construction and makes 4.2 free.
//
// There is no corridor generator here and there must never be one. A 1-D chain of
// segments down one centreline cannot express a junction, cannot express a branch, and
// every fix to it buys one course while selling another.

function smoothstep(x) {
  if (x <= 0) return 0;
  if (x >= 1) return 1;
  return x * x * (3 - 2 * x);
}

// ---- the pieces -------------------------------------------------------------
// `u` runs along the piece's own axis, `t` across it, both in [0,1].

function pieceLen(p) { return p.axis === 'x' ? p.w : p.h; }

function pieceHeight(p, cx, cy) {
  var u, t;
  if (p.axis === 'y') { u = (cy - p.y) / p.h; t = (cx - p.x) / p.w; }
  else                { u = (cx - p.x) / p.w; t = (cy - p.y) / p.h; }
  if (u < 0) u = 0; else if (u > 1) u = 1;
  if (t < 0) t = 0; else if (t > 1) t = 1;

  if (p.kind === 'bowl') {
    // Chebyshev radius, so r is exactly 1 on the WHOLE boundary and the rim seams flat
    // against the pad it is sunk into. A dish that collects: the restoring slope grows
    // linearly with offset (LAW 5.6 — a surface with a rule must carry a SHAPE).
    var rx = Math.abs(2 * (cx - (p.x + p.w / 2)) / p.w);
    var ry = Math.abs(2 * (cy - (p.y + p.h / 2)) / p.h);
    var r = Math.max(rx, ry); if (r > 1) r = 1;
    return p.z - p.depth * (1 - r * r);
  }

  var base = p.z - (p.slope || 0) * u * pieceLen(p);
  var d = 2 * t - 1;

  switch (p.kind) {
    case 'pad':
    case 'ramp':
      return base;
    case 'chute':
      // Banking OPENS AND CLOSES along its length so both ends seam flat against a pad.
      // LAW 6.3: full banking at the mouth made the pad in front absorb the whole rim in
      // one cell — a 1.4-unit step, more than three times critical. A launch ramp
      // disguised as a joint.
      return base + p.bank * Math.sin(Math.PI * u) * d * d;
    case 'tube':
      // A chute you can LIVE IN: the rim is held flat-topped across the middle 64% and
      // folded away over the first and last 18%.
      return base + p.bank * smoothstep(Math.min(u, 1 - u) / 0.18) * d * d;
    case 'funnel':
      var thr = 1 + (p.throat - 1) * u;
      var q = Math.min(1, Math.abs(d) / thr);
      return base + p.rise * Math.sin(Math.PI * u) * q * q;
    case 'wave':
      return base + p.amp * (1 - Math.cos(2 * Math.PI * u * p.waves)) / 2;
    case 'crown':
      // A RIDGE — the inverse of a chute. The crest is high ground and both edges fall
      // into the void, so the drift finishes itself. Nothing has to touch you.
      return base + p.rise * Math.sin(Math.PI * u) * (1 - d * d);
    case 'bank':
      // A CAMBER. `tilt` is SIGNED and is the total height difference across the piece.
      // LAW 6.6: it points gravity at one edge for the whole length of a leg, so holding
      // a line costs input CONTINUOUSLY rather than at a moment.
      return base + p.tilt * smoothstep(Math.min(u, 1 - u) / 0.15) * (t - 0.5);
    default:
      throw new Error('piece with no height function: ' + p.kind);
  }
}

function piece(o) {
  if (o.kind !== 'cut' && o.kind !== 'paint' && o.kind !== 'bowl') {
    o.exit = o.z - (o.slope || 0) * pieceLen(o);
  } else {
    o.exit = o.z;
  }
  if (o.surf === undefined) o.surf = SURF.FAIRWAY;
  return o;
}

// ---- authoring helpers ------------------------------------------------------
// Each returns its own exit height and the next leg is handed that number, so two pieces
// that meet always agree BY CONSTRUCTION. Heights are never typed twice.

function pad(x, y, w, h, z, surf)  { return piece({ kind:'pad', axis:'x', x:x,y:y,w:w,h:h,z:z, surf:surf }); }
function cut(x, y, w, h)           { return piece({ kind:'cut', axis:'x', x:x,y:y,w:w,h:h,z:0 }); }

function rampX(x,y,w,h,z,slope,surf){ return piece({ kind:'ramp', axis:'x', x:x,y:y,w:w,h:h,z:z,slope:slope,surf:surf }); }
function rampY(x,y,w,h,z,slope,surf){ return piece({ kind:'ramp', axis:'y', x:x,y:y,w:w,h:h,z:z,slope:slope,surf:surf }); }

function chuteX(x,y,w,h,z,slope,bank,surf){ return piece({ kind:'chute', axis:'x', x:x,y:y,w:w,h:h,z:z,slope:slope,bank:bank,surf:surf }); }
function chuteY(x,y,w,h,z,slope,bank,surf){ return piece({ kind:'chute', axis:'y', x:x,y:y,w:w,h:h,z:z,slope:slope,bank:bank,surf:surf }); }

function tubeX(x,y,w,h,z,slope,bank,surf){ return piece({ kind:'tube', axis:'x', x:x,y:y,w:w,h:h,z:z,slope:slope,bank:bank,surf:surf }); }
function tubeY(x,y,w,h,z,slope,bank,surf){ return piece({ kind:'tube', axis:'y', x:x,y:y,w:w,h:h,z:z,slope:slope,bank:bank,surf:surf }); }

function funnelX(x,y,w,h,z,slope,rise,throat,surf){ return piece({ kind:'funnel', axis:'x', x:x,y:y,w:w,h:h,z:z,slope:slope,rise:rise,throat:throat,surf:surf }); }
function funnelY(x,y,w,h,z,slope,rise,throat,surf){ return piece({ kind:'funnel', axis:'y', x:x,y:y,w:w,h:h,z:z,slope:slope,rise:rise,throat:throat,surf:surf }); }

function bankX(x,y,w,h,z,slope,tilt,surf){ return piece({ kind:'bank', axis:'x', x:x,y:y,w:w,h:h,z:z,slope:slope,tilt:tilt,surf:surf }); }
function bankY(x,y,w,h,z,slope,tilt,surf){ return piece({ kind:'bank', axis:'y', x:x,y:y,w:w,h:h,z:z,slope:slope,tilt:tilt,surf:surf }); }

function crownX(x,y,w,h,z,slope,rise,surf){ return piece({ kind:'crown', axis:'x', x:x,y:y,w:w,h:h,z:z,slope:slope,rise:rise,surf:surf }); }
function crownY(x,y,w,h,z,slope,rise,surf){ return piece({ kind:'crown', axis:'y', x:x,y:y,w:w,h:h,z:z,slope:slope,rise:rise,surf:surf }); }

function waveX(x,y,w,h,z,slope,amp,waves,surf){ return piece({ kind:'wave', axis:'x', x:x,y:y,w:w,h:h,z:z,slope:slope,amp:amp,waves:waves,surf:surf }); }
function waveY(x,y,w,h,z,slope,amp,waves,surf){ return piece({ kind:'wave', axis:'y', x:x,y:y,w:w,h:h,z:z,slope:slope,amp:amp,waves:waves,surf:surf }); }

// `z` is the RIM. The dish sinks `depth` below it, so a bowl always seams flat against
// the pad it is cut into and the author never re-derives a parent's height function.
function bowl(x,y,w,h,z,depth,surf){ return piece({ kind:'bowl', axis:'x', x:x,y:y,w:w,h:h,z:z,depth:depth,surf:surf }); }
function pond(x,y,w,h,z,depth)     { return bowl(x,y,w,h,z,depth,SURF.WATER); }
function greenDish(x,y,w,h,z,depth){ return bowl(x,y,w,h,z,depth,SURF.GREEN); }

function belt(x,y,w,h,z,dx,dy) {
  var m = Math.hypot(dx, dy);
  return piece({ kind:'pad', axis:'x', x:x,y:y,w:w,h:h,z:z, surf:SURF.BELT, fx:dx/m, fy:dy/m });
}

// LAW 6.2 — `paint` writes surface and flow onto ground that ALREADY EXISTS and touches
// NO height. It is why water and fragile paper are authoring moves rather than arithmetic
// problems: a channel can run down one side of a banked leg without the author
// re-deriving the parent's height function at an offset and getting it a hundredth wrong
// — which is a seam, and a seam is a cliff. It paints solid cells only, so a strip that
// overhangs its parent quietly does nothing instead of quietly adding floor.
function paint(x,y,w,h,surf,fx,fy){ return piece({ kind:'paint', axis:'x', x:x,y:y,w:w,h:h,z:0, surf:surf, fx:fx, fy:fy }); }
function water(x,y,w,h)   { return paint(x,y,w,h,SURF.WATER); }
function fragile(x,y,w,h) { return paint(x,y,w,h,SURF.FRAGILE); }
function sand(x,y,w,h)    { return paint(x,y,w,h,SURF.SAND); }
function rough(x,y,w,h)   { return paint(x,y,w,h,SURF.ROUGH); }
function dry(x,y,w,h)     { return paint(x,y,w,h,SURF.FAIRWAY); }
function drySlot(x,y,w,h) { return paint(x,y,w,h,SURF.FAIRWAY); }   // a gate through water
function beltOver(x,y,w,h,dx,dy) {
  var m = Math.hypot(dx, dy);
  return paint(x,y,w,h,SURF.BELT,dx/m,dy/m);
}

// A gate is a short FLAT span with the void — or water, which is not ground either —
// hard against both sides. It carries its own flag coordinate, so a gate cannot be moved
// and leave its checkpoint standing in the void where it used to be (LAW 10.1).
// It is FLAT because a checkpoint is also a respawn: a gate on a slope is a gate you roll
// off during the two-second hold.
function gateX(x, y, len, w, z) {
  var p = pad(x, y, len, w, z);
  p.gate = 'x';
  p.flag = { x: x + len / 2, y: y + w / 2, r: 0 };
  return p;
}
function gateY(x, y, w, len, z) {
  var p = pad(x, y, w, len, z);
  p.gate = 'y';
  p.flag = { x: x + w / 2, y: y + len / 2, r: 0 };
  return p;
}
// Exactly one flag in the whole game may declare this — the one the tier shortcut gives
// up (LAW 10.3).
function skips(flag, routes) { flag.skip = routes; return flag; }

// ---- routes -----------------------------------------------------------------
// An authored polyline from the tee to the cup, per branch. This is the only thing that
// knows "the way through" — the geometry does not have to encode it.

function makeRoute(pts) {
  var cum = [0], total = 0;
  for (var i = 1; i < pts.length; i++) {
    total += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
    cum.push(total);
  }
  return { pts: pts, cum: cum, total: total };
}

function pointAt(route, s) {
  var pts = route.pts, cum = route.cum;
  if (s <= 0) return { x: pts[0].x, y: pts[0].y };
  if (s >= route.total) return { x: pts[pts.length - 1].x, y: pts[pts.length - 1].y };
  var lo = 0, hi = cum.length - 1;
  while (lo + 1 < hi) { var mid = (lo + hi) >> 1; if (cum[mid] <= s) lo = mid; else hi = mid; }
  var seg = cum[lo + 1] - cum[lo];
  var f = seg < 1e-12 ? 0 : (s - cum[lo]) / seg;
  return { x: pts[lo].x + (pts[lo + 1].x - pts[lo].x) * f,
           y: pts[lo].y + (pts[lo + 1].y - pts[lo].y) * f };
}

function project(route, x, y) {
  var pts = route.pts, cum = route.cum, bd = Infinity, bs = 0;
  for (var i = 0; i + 1 < pts.length; i++) {
    var ax = pts[i].x, ay = pts[i].y;
    var bx = pts[i + 1].x - ax, by = pts[i + 1].y - ay;
    var L2 = bx * bx + by * by;
    var f = L2 < 1e-12 ? 0 : ((x - ax) * bx + (y - ay) * by) / L2;
    if (f < 0) f = 0; else if (f > 1) f = 1;
    var dx = x - (ax + bx * f), dy = y - (ay + by * f);
    var d2 = dx * dx + dy * dy;
    if (d2 < bd) { bd = d2; bs = cum[i] + f * Math.sqrt(L2); }
  }
  return { s: bs, d2: bd };
}

// ---- checkpoint measurement (section 10) ------------------------------------
// Walks out cell by cell and stops at the first that is not GROUND. Water is not ground:
// contact with it is a loss, so a ball can no more stand on it than on the void. That is
// what lets a dry SLOT through a band of water be a neck.
function paperSpan(g, x, y, axis) {
  var dx = axis === 0 ? 1 : 0, dy = axis === 0 ? 0 : 1;
  if (!groundAt(g, x, y)) return { span: 0, lo: x, hi: x };
  var i0 = Math.floor(axis === 0 ? x - g.ox : y - g.oy);
  var hiC = i0, loC = i0, k;
  for (k = 1; k <= 60; k++) { if (groundAt(g, x + dx * k, y + dy * k)) hiC = i0 + k; else break; }
  for (k = 1; k <= 60; k++) { if (groundAt(g, x - dx * k, y - dy * k)) loC = i0 - k; else break; }
  var org = axis === 0 ? g.ox : g.oy;
  return { span: (hiC + 1) - loC, lo: org + loC, hi: org + hiC + 1 };
}

// The NARROWER axis is the cross-section; the ball travels the wider one. `need` is the
// furthest place on that cross-section a ball's CENTRE can be — the paper's edge minus
// BALL_R. The radius is DERIVED from the paper measured there, never typed.
function gateAt(g, x, y) {
  var sx = paperSpan(g, x, y, 0), sy = paperSpan(g, x, y, 1);
  var cross = sx.span <= sy.span ? sx : sy;
  var axis = sx.span <= sy.span ? 0 : 1;
  var p = axis === 0 ? x : y;
  var need = Math.max(p - cross.lo, cross.hi - p) - BALL_R;
  return {
    r: Math.max(GATE_R_MIN, need + GATE_MARGIN),
    cross: cross.span, along: (axis === 0 ? sy : sx).span, axis: axis,
    lo: cross.lo, hi: cross.hi,
  };
}

// ---- the compile pass -------------------------------------------------------
// Everything a level needs comes out of this one sweep.

function compile(course) {
  var P = course.pieces, i, j, k, p;

  var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (i = 0; i < P.length; i++) {
    p = P[i];
    if (p.x < minX) minX = p.x;
    if (p.y < minY) minY = p.y;
    if (p.x + p.w > maxX) maxX = p.x + p.w;
    if (p.y + p.h > maxY) maxY = p.y + p.h;
  }
  var ox = Math.floor(minX) - 2, oy = Math.floor(minY) - 2;
  var nx = Math.ceil(maxX) + 2 - ox, ny = Math.ceil(maxY) + 2 - oy;
  var g = makeGrid(nx, ny, ox, oy);
  var W1 = nx + 1;
  var seams = [];

  for (i = 0; i < P.length; i++) {
    p = P[i];
    var cx0 = Math.round(p.x - ox), cy0 = Math.round(p.y - oy);
    var cw = Math.round(p.w), ch = Math.round(p.h);

    if (p.kind === 'cut') {
      for (j = cy0; j < cy0 + ch; j++) {
        if (j < 0 || j >= ny) continue;                       // per AXIS (LAW 6.4)
        for (k = cx0; k < cx0 + cw; k++) {
          if (k < 0 || k >= nx) continue;
          g.solid[j * nx + k] = 0;
        }
      }
      continue;
    }

    if (p.kind === 'paint') {
      for (j = cy0; j < cy0 + ch; j++) {
        if (j < 0 || j >= ny) continue;
        for (k = cx0; k < cx0 + cw; k++) {
          if (k < 0 || k >= nx) continue;
          var pk = j * nx + k;
          if (!g.solid[pk]) continue;                          // solid cells ONLY
          g.surf[pk] = p.surf;
          g.fx[pk] = p.fx || 0; g.fy[pk] = p.fy || 0;
        }
      }
      continue;
    }

    // Corner heights over [x..x+w] x [y..y+h] INCLUSIVE, so neighbours share a line.
    for (j = cy0; j <= cy0 + ch; j++) {
      if (j < 0 || j > ny) continue;
      for (k = cx0; k <= cx0 + cw; k++) {
        if (k < 0 || k > nx) continue;
        var ck = j * W1 + k;
        var hz = pieceHeight(p, ox + k, oy + j);
        // The seam check is on the PERIMETER only. A bowl sunk into a pad disagrees with
        // it everywhere inside on purpose — that is the authoring model, lay the big
        // shapes down then carve. The perimeter is where it MEETS its neighbour.
        var onEdge = (k === cx0 || k === cx0 + cw || j === cy0 || j === cy0 + ch);
        if (onEdge && g.hp[ck] && !p.embed && Math.abs(g.h[ck] - hz) > SEAM_TOL)
          seams.push({ x: ox + k, y: oy + j, was: g.h[ck], now: hz, kind: p.kind, i: i });
        g.h[ck] = hz;
        g.hp[ck] = 1;
      }
    }
    for (j = cy0; j < cy0 + ch; j++) {
      if (j < 0 || j >= ny) continue;
      for (k = cx0; k < cx0 + cw; k++) {
        if (k < 0 || k >= nx) continue;
        var sk = j * nx + k;
        g.solid[sk] = 1;
        g.surf[sk] = p.surf;
        g.fx[sk] = p.fx || 0; g.fy[sk] = p.fy || 0;
      }
    }
  }

  var lowest = Infinity;
  for (k = 0; k < g.h.length; k++) if (g.hp[k] && g.h[k] < lowest) lowest = g.h[k];
  var voidZ = lowest - VOID_DEPTH;
  for (k = 0; k < g.h.length; k++) if (!g.hp[k]) g.h[k] = voidZ;

  // LAW 5.3 — dilate the height field TWO RINGS past the paper, so the gradient at an
  // edge is the real slope of the ground the ball is on. Without it gradAt on the last
  // solid cell of a lip samples void filler 40 units down, reports a slope of -18, and
  // the launch test converts that into 300 units/s straight down: the ball VANISHES at
  // the edge instead of flying off it.
  for (var pass = 0; pass < 2; pass++) {
    var idx = [], val = [];
    for (j = 0; j <= ny; j++) for (k = 0; k <= nx; k++) {
      var dk = j * W1 + k;
      if (g.hp[dk]) continue;
      var sum = 0, n = 0;
      if (k > 0  && g.hp[dk - 1])  { sum += g.h[dk - 1];  n++; }
      if (k < nx && g.hp[dk + 1])  { sum += g.h[dk + 1];  n++; }
      if (j > 0  && g.hp[dk - W1]) { sum += g.h[dk - W1]; n++; }
      if (j < ny && g.hp[dk + W1]) { sum += g.h[dk + W1]; n++; }
      if (n) { idx.push(dk); val.push(sum / n); }
    }
    for (i = 0; i < idx.length; i++) { g.h[idx[i]] = val[i]; g.hp[idx[i]] = 1; }
  }

  course.grid = g;
  course.seams = seams;
  course.lowestZ = lowest;
  course.deathZ = lowest - DEATH_DROP;

  // The trigger radius is derived from the paper measured at the flag, never typed.
  for (i = 0; i < course.flags.length; i++) {
    var f = course.flags[i];
    var ga = gateAt(g, f.x, f.y);
    f.r = ga.r; f.cross = ga.cross; f.along = ga.along;
  }
  course.cup.z = heightAt(g, course.cup.x, course.cup.y);

  var rs = [];
  for (i = 0; i < course.routes.length; i++) rs.push(makeRoute(course.routes[i]));
  course.routes = rs;

  return course;
}

/* ===== src/hazards.js ===== */
// HAZARDS — five primitives, everything else is data.
//
// LAW 9.1 — a threat should change the ball's VELOCITY, not occupy a tile. Steering
// around scenery is the least interesting thing this control scheme can do.

var CATALOG = {
  tree:    { prim: 'STATIC', r: 0.55, h: 2.4, art: 'tree' },
  tee:     { prim: 'STATIC', r: 0.26, h: 0.7, art: 'tee' },
  bench:   { prim: 'STATIC', r: 0.72, h: 0.9, art: 'bench' },
  post:    { prim: 'STATIC', r: 0.24, h: 1.5, art: 'post' },
  windmill:{ prim: 'STATIC', r: 0.78, h: 2.8, art: 'windmill' },
  washer:  { prim: 'STATIC', r: 0.36, h: 1.1, art: 'washer' },

  // `flatten` is what a Marble Madness hammer actually did: it never took the marble, it
  // took the marble's SHAPE. Nine tenths of a second flat is nine tenths of a second of
  // gravity with no say in it — seconds on a junction, the leg on a catwalk.
  mallet:  { prim: 'PERIODIC', path: 'pendulum', r: 0.46, h: 1.7, amp: 3.2,
             omega: 1.35, flatten: 0.85, art: 'mallet' },
  cart:    { prim: 'PERIODIC', path: 'loop', r: 0.80, h: 1.4, radius: 3.2,
             omega: 0.7, art: 'cart' },
  gate:    { prim: 'PERIODIC', path: 'swing', r: 0.50, h: 1.5, amp: 2.6,
             omega: 0.9, art: 'gate' },

  golfer:  { prim: 'SEEKER', r: 0.58, h: 1.9, accel: 9,  maxSpeed: 7.0, leash: 12 },
  dog:     { prim: 'SEEKER', r: 0.34, h: 0.9, accel: 14, maxSpeed: 9.0, leash: 10 },
  goose:   { prim: 'SEEKER', r: 0.32, h: 0.9, accel: 11, maxSpeed: 8.0, leash: 9  },

  rival:   { prim: 'RIVAL', r: 0.34, h: 0.62, accel: 12, maxSpeed: 9.0,
             leash: 4, mass: 1.6, art: 'rival' },

  sprinkler: { prim: 'TRIGGER', kind: 'sprinkler', r: 2.6, omega: 0.8, push: 13 },
  muncher:   { prim: 'TRIGGER', kind: 'muncher', r: 3.0, pull: 15 },
};

// One placed threat, indexed into the catalog. Authored in levels.js.
function haz(name, x, y, phase, leash) {
  return { name: name, x: x, y: y, phase: phase || 0, leash: leash };
}

// The C axis: across the descent. A hammer sweeps the WIDTH of a lane, not its length.
var C_AX = 1 / Math.SQRT2, C_AY = -1 / Math.SQRT2;

function buildBodies(run) {
  var list = run.course.hazards || [];
  run.bodies.length = 0;
  for (var i = 0; i < list.length; i++) {
    var p = list[i], def = CATALOG[p.name];
    if (!def) throw new Error('unknown hazard: ' + p.name);
    var b = {
      name: p.name, def: def, prim: def.prim, art: def.art || p.name,
      hx: p.x, hy: p.y, x: p.x, y: p.y,
      z: heightAt(run.grid, p.x, p.y),
      r: def.r, h: def.h || 1.4,
      vx: 0, vy: 0, kx: 0, ky: 0, knock: 0, downT: 0,
      phase: p.phase || 0, leash: p.leash || def.leash || 0,
      engaged: false, active: true, face: 0,
      bumps: def.prim !== 'TRIGGER',      // a trigger is a field, not a body
      mass: def.mass, flatten: def.flatten,
      on: false,
    };
    run.bodies.push(b);
  }
}

// The sweep a hazard's disc covers. For a chaser the disc is its WHOLE LEASH, because
// that is how far it will walk to reach you (LAW 9.2).
function hazSweep(b) {
  var path = 0;
  if (b.prim === 'PERIODIC') {
    path = b.def.path === 'loop' ? b.def.radius : b.def.amp;
  } else if (b.prim === 'SEEKER' || b.prim === 'RIVAL') {
    path = b.leash;
  } else if (b.prim === 'TRIGGER') {
    path = b.def.r;
  }
  return path + b.r + BALL_R;
}

// Walkable means solid paper more than SEEK_CLEAR clear of every static. A dog that runs
// off a catwalk reads as broken.
function walkable(run, x, y) {
  if (solidAt(run.grid, x, y) !== 1) return false;
  if (surfAt(run.grid, x, y) === SURF.WATER) return false;
  var list = run.bodies;
  for (var i = 0; i < list.length; i++) {
    var s = list[i];
    if (s.prim !== 'STATIC') continue;
    var dx = x - s.x, dy = y - s.y, rr = s.r + SEEK_CLEAR;
    if (dx * dx + dy * dy < rr * rr) return false;
  }
  return true;
}

// Greedy 16-direction step check: probe SEEK_LOOK ahead, and if that is blocked fan out
// +/-1..7 steps of pi/8 from the desired heading and take the first that is not.
function seekHeading(run, c, tx, ty) {
  var dx = tx - c.x, dy = ty - c.y;
  if (Math.hypot(dx, dy) < 1e-6) return null;
  var base = Math.atan2(dy, dx);
  for (var k = 0; k <= 7; k++) {
    for (var s = 0; s < (k === 0 ? 1 : 2); s++) {
      var a = base + (s === 0 ? k : -k) * (Math.PI / 8);
      if (walkable(run, c.x + Math.cos(a) * SEEK_LOOK, c.y + Math.sin(a) * SEEK_LOOK))
        return a;
    }
  }
  return null;
}

// Engagement is hysteretic, and the numbers matter — without the gap a chaser chatters on
// the leash boundary. Both a seeker and a rival disengage while the respawn hold is
// running, so the grace period cannot be spent being shoved off the flag you just reached.
function engagement(run, c, gate) {
  if (run.holdT > 0) { c.engaged = false; return; }
  var b = run.ball;
  var dHome = Math.hypot(c.x - c.hx, c.y - c.hy);
  var dBall = Math.hypot(c.x - b.x, c.y - b.y);
  if (!c.engaged) {
    if (dHome < c.leash * gate && dBall < c.leash * 0.95) c.engaged = true;
  } else if (dHome > c.leash) {
    c.engaged = false;
  }
}

function stepBodies(run) {
  var list = run.bodies, b = run.ball;
  for (var i = 0; i < list.length; i++) {
    var c = list[i];
    var px = c.x, py = c.y;

    if (c.prim === 'STATIC') {
      c.vx = 0; c.vy = 0;
      continue;
    }

    if (c.prim === 'PERIODIC') {
      var a = c.def.omega * run.t + c.phase;
      if (c.def.path === 'pendulum') {
        var off = c.def.amp * Math.sin(a);
        c.x = c.hx + C_AX * off; c.y = c.hy + C_AY * off;
      } else if (c.def.path === 'loop') {
        c.x = c.hx + c.def.radius * Math.cos(a);
        c.y = c.hy + c.def.radius * Math.sin(a);
      } else {                                   // swing: an arm laid along C, rotating
        var ang = Math.atan2(C_AY, C_AX) + 0.9 * Math.sin(a);
        c.x = c.hx + c.def.amp * Math.cos(ang);
        c.y = c.hy + c.def.amp * Math.sin(ang);
      }
      c.vx = (c.x - px) / DT; c.vy = (c.y - py) / DT;   // real momentum for the impulse
      c.z = heightAt(run.grid, c.x, c.y);
      c.face = Math.atan2(c.vy, c.vx);
      continue;
    }

    if (c.prim === 'TRIGGER') {
      c.on = c.def.kind === 'sprinkler'
           ? Math.sin(c.def.omega * run.t + c.phase) > 0.25
           : true;
      continue;
    }

    if (c.prim === 'SEEKER') {
      engagement(run, c, 0.55);
      var tx = c.engaged ? b.x : c.hx, ty = c.engaged ? b.y : c.hy;
      var head = seekHeading(run, c, tx, ty);
      if (head === null) { c.vx = 0; c.vy = 0; }
      else {
        c.vx += Math.cos(head) * c.def.accel * DT;
        c.vy += Math.sin(head) * c.def.accel * DT;
        var sp = Math.hypot(c.vx, c.vy);
        if (sp > c.def.maxSpeed) { c.vx *= c.def.maxSpeed / sp; c.vy *= c.def.maxSpeed / sp; }
        var nx = c.x + c.vx * DT, ny = c.y + c.vy * DT;
        if (walkable(run, nx, ny)) { c.x = nx; c.y = ny; }
        else { c.vx = 0; c.vy = 0; }
        c.face = head;
      }
      if (!c.engaged && Math.hypot(c.x - c.hx, c.y - c.hy) < 0.05) { c.vx = 0; c.vy = 0; }
      c.z = heightAt(run.grid, c.x, c.y);
      continue;
    }

    // RIVAL — the only threat in the game you beat rather than avoid. It does NOT path
    // around the void: a marble that runs off a catwalk reads as a marble, and that is
    // what makes leading it over an edge a real move.
    c.vx += c.kx; c.vy += c.ky; c.kx = 0; c.ky = 0;
    if (c.knock > 0) c.knock -= DT;

    if (c.downT > 0) {
      c.downT -= DT;
      if (c.downT <= 0) {
        c.x = c.hx; c.y = c.hy; c.vx = 0; c.vy = 0; c.engaged = false;
        c.z = heightAt(run.grid, c.x, c.y); c.active = true;
      }
      continue;
    }

    engagement(run, c, 0.6);
    var rtx = c.engaged ? b.x : c.hx, rty = c.engaged ? b.y : c.hy;
    var rdx = rtx - c.x, rdy = rty - c.y, rm = Math.hypot(rdx, rdy);
    if (rm > 0.08) {
      c.vx += (rdx / rm) * c.def.accel * DT;
      c.vy += (rdy / rm) * c.def.accel * DT;
    }
    c.vx -= RIVAL_DRAG * c.vx * DT; c.vy -= RIVAL_DRAG * c.vy * DT;
    // RIVAL_KNOCK seconds of grace let a rammed rival exceed its own top speed, which is
    // what a ram looks like.
    if (c.knock <= 0) {
      var rs = Math.hypot(c.vx, c.vy);
      if (rs > c.def.maxSpeed) { c.vx *= c.def.maxSpeed / rs; c.vy *= c.def.maxSpeed / rs; }
    }
    c.x += c.vx * DT; c.y += c.vy * DT;
    c.face = Math.atan2(c.vy, c.vx);
    if (solidAt(run.grid, c.x, c.y) !== 1 || surfAt(run.grid, c.x, c.y) === SURF.WATER) {
      c.downT = RIVAL_DOWN; c.active = false;
      emit(run, 'rivaldown');
    } else {
      c.z = heightAt(run.grid, c.x, c.y);
    }
  }
}

// TRIGGER fields act on the ball. They never block; the muncher takes your LINE before it
// takes your ball, and the sprinkler only ever spoils one.
function applyTriggers(run) {
  var b = run.ball, list = run.bodies;
  if (b.state !== ST.ROLL) return;
  for (var i = 0; i < list.length; i++) {
    var c = list[i];
    if (c.prim !== 'TRIGGER' || !c.on) continue;
    if (b.z > c.z + WALL_STEP) continue;          // a field is on the ground, like a trigger
    var dx = b.x - c.x, dy = b.y - c.y;
    var d = Math.hypot(dx, dy);
    if (d >= c.def.r) continue;

    if (c.def.kind === 'sprinkler') {
      if (d < 1e-6) continue;
      var pu = c.def.push * (1 - d / c.def.r) * DT;
      b.vx += (dx / d) * pu; b.vy += (dy / d) * pu;
      continue;
    }

    // The muncher: Marble Madness's vacuum. It never chases. There is an exact radius
    // r*(1 - K/pull) = 1.2 of its 3 tiles inside which no amount of input climbs back
    // out — and the renderer DRAWS that circle, because a point of no return you cannot
    // see is just an unfair death.
    if (d < 0.8) {
      b.x = c.x; b.y = c.y; b.vx = 0; b.vy = 0;
      enterSink(run, 'eaten');
      return;
    }
    var pl = c.def.pull * (1 - d / c.def.r) * DT;
    b.vx -= (dx / d) * pl; b.vy -= (dy / d) * pl;
  }
}

// The radius inside which no amount of input climbs back out. Derived, never typed.
function muncherHold(def) { return def.r * (1 - K / def.pull); }

/* ===== src/levels.js ===== */
// THE SIX COURSES. Authored by hand, in order, with no RNG anywhere in the level path —
// a course is byte-for-byte what the author wrote, every time.
//
// Read the comments: they are why, not what.

// 1. PRACTICE GREEN — 3 flags
// Teaches the five things the game is: the ball keeps going, the world runs
// down-right and down-left rather than straight down, the gap between two paths
// is not floor, going over an edge on purpose is a move — and that the two ways
// down are not the same way down twice.
function practice() {
  var P = [], z = 40;

  // Eight tiles square, and it is the ONLY ground of that shape on the course.
  P.push(pad(0, 0, 8, 8, z));
  var l1 = rampX(8, 1, 15, 6, z, 0.14);                 P.push(l1);   z = l1.exit;

  // GATE 1: the lane is six wide and the way out of it is three, with the void
  // hard against both sides. No line down this leg misses the checkpoint.
  var g1 = gateX(23, 3, 4, 3, z);                       P.push(g1);

  // The junction, cut back to the elbow the turn actually uses.
  P.push(pad(27, 0, 11, 10, z));
  P.push(cut(34, 0, 4, 4));

  // The first fork, and the two sides are not the same lane twice. The left is
  // flat. The right is tilted 0.7 across four tiles — cross-slope 0.175, so
  // gravity spends about four of the nine units of input the player has, for all
  // sixteen tiles of it, and the low side of it is the void.
  var safe = rampY(28, 10, 4, 16, z, 0.14);             P.push(safe);
  P.push(bankY(34, 10, 4, 16, z, 0.14, 0.7));
  z = safe.exit;

  P.push(pad(26, 26, 13, 9, z));
  // Water, on the course that cannot punish it, in the corner nothing routes
  // through: this is where a player learns that the blue is not scenery.
  P.push(pond(26, 31, 4, 4, z, 0.5));
  // ...and the rest of the lower half is a DISH. A dish is the cheapest way to
  // stop a junction being a room: it takes no paper away and there is no square
  // foot of it a ball sits still on.
  P.push(bowl(31, 30, 8, 5, z, 0.35));

  // GATE 2 is on the way OUT of the rejoin rather than on it. A checkpoint on a
  // junction two lanes arrive at cannot gate both; one on the single neck they
  // both leave by gates the pair for free.
  var g2 = gateX(39, 28, 4, 3, z);                      P.push(g2);
  var l2 = rampX(43, 26, 15, 6, z, 0.16);               P.push(l2);   z = l2.exit;

  P.push(pad(58, 24, 8, 10, z));
  // GATE 3 is a leg and a tier short of the cup, not on the green beside it.
  var g3 = gateY(61, 34, 3, 4, z);                      P.push(g3);
  var l3 = rampY(60, 38, 5, 12, z, 0.20);               P.push(l3);   z = l3.exit;

  // The teaching tier. Three tiles of void and 2.6 units down onto a green wide
  // enough to be wrong on: at the leg's terminal 13 u/s the ball flies 5.4 tiles
  // and at a crawl it flies nothing, so the way past it is not braking — which
  // is the whole game said once, gently, on a course that cannot punish it hard.
  P.push(pad(56, 53, 12, 12, z - 2.6, SURF.GREEN));
  P.push(greenDish(58, 55, 8, 8, z - 2.6, 0.4));

  return {
    name: 'PRACTICE GREEN',
    parTime: 16, bonus: 3,
    pieces: P,
    start: { x: 4, y: 4 },
    cup: { x: 62, y: 59, r: 0.9 },
    // Never typed. Each is the centre of the gate it stands on, so a gate that
    // moves takes its checkpoint with it.
    flags: [g1.flag, g2.flag, g3.flag],
    routes: [
      [{ x: 4, y: 4 }, { x: 16, y: 4 }, g1.flag, { x: 30, y: 6 },
       { x: 30, y: 14 }, { x: 30, y: 24 }, { x: 31, y: 29 }, g2.flag,
       { x: 48, y: 29 }, { x: 57, y: 29 }, { x: 62, y: 30 }, g3.flag,
       { x: 62.5, y: 44 }, { x: 62.5, y: 49 }, { x: 62, y: 56 }, { x: 62, y: 59 }],
      [{ x: 4, y: 4 }, { x: 16, y: 4 }, g1.flag, { x: 32, y: 6 },
       { x: 36, y: 8 }, { x: 36, y: 14 }, { x: 36, y: 24 }, { x: 37, y: 29 }, g2.flag,
       { x: 48, y: 29 }, { x: 57, y: 29 }, { x: 62, y: 30 }, g3.flag,
       { x: 62.5, y: 44 }, { x: 62.5, y: 49 }, { x: 62, y: 56 }, { x: 62, y: 59 }],
    ],
    // A static two tiles from the racing line is an obstacle; one ON it is a
    // wall, and the first leg of the first course is not where a wall belongs.
    hazards: [haz('tee', 16, 4), haz('tee', 19, 4), haz('tree', 31, 8)],
  };
}

// 2. THE LADDER — 3 flags
// The first real BRANCH. One way down is short, made of paper that goes away under you,
// and entered over a LEDGE you have to commit to — with a belt on the junction floor
// feeding you at that lip whether that was the plan or not. The other is longer, wider,
// gentler at its mouth, and has things living on it. They share a checkpoint at each end
// and nothing in between. Closes on a camber cut in two by its last gate.
function ladder() {
  var P = [], z = 40;
  P.push(pad(0, 0, 8, 8, z));

  // Opens on a CHUTE, not a ramp. No two courses open the same way, and the first thing
  // this one does is take the steering away for fourteen tiles.
  var c1 = chuteX(8, 0, 14, 8, z, 0.20, 1.1);           P.push(c1);   z = c1.exit;
  var g1 = gateX(22, 3, 4, 3, z);                       P.push(g1);

  // The splitting junction. The pond is in the corner nothing routes through — it is what
  // makes eleven tiles of pad unsittable as well as being the water on this course — and
  // the belt across the floor is aimed at the left-hand lip.
  P.push(pad(26, 0, 11, 10, z));
  P.push(pond(26, 6, 3, 4, z, 0.45));
  P.push(beltOver(30, 6, 7, 4, 0, 1));

  // LEFT — short. Off the lip at y=10, across THREE tiles of void and three units down,
  // then twenty tiles of paper that cracks the moment you are genuinely on it.
  // Three tiles, not two: at a two-cell gap the height dilation reaches across from both
  // sides and averages the two tiers into one corner, which invents a slope of 1.05 at
  // the landing. Every void gap in this game is at least three cells wide.
  var ls = rampY(30, 13, 6, 20, z - 3.0, 0.30);         P.push(ls);
  P.push(fragile(30, 16, 6, 14));
  P.push(pad(30, 33, 6, 6, ls.exit));
  // The rejoin height is DERIVED on both sides, never typed, so the two ways down cannot
  // grow a step between them.
  var zJoin = 27.6;
  var lx = rampX(36, 33, 12, 6, ls.exit, (ls.exit - zJoin) / 12);   P.push(lx);

  // RIGHT — longer, eight wide throughout, gentle at the mouth, and populated. It closes
  // on a TUBE: the one place in the game where speed is the safe answer, because a fast
  // ball climbs the rim and the wall hands it back still pointed down the piece.
  var r1 = rampX(37, 1, 15, 8, z, 0.17);                P.push(r1);
  P.push(pad(52, 1, 8, 8, r1.exit));
  P.push(cut(56, 1, 4, 3));
  var r2 = tubeY(52, 9, 8, 24, r1.exit, (r1.exit - zJoin) / 24, 1.2);  P.push(r2);

  // The rejoin, with a hole cut out of the middle: fourteen tiles of pad is otherwise the
  // safest ground on the course, and the hole makes it two ways round with a wrong one.
  P.push(pad(48, 33, 14, 10, zJoin));
  P.push(cut(53, 36, 5, 5));
  var g2 = gateX(62, 36, 4, 3, zJoin);                  P.push(g2);

  // A CAMBER, cut in two by its last gate — and the second half leans the other way, so
  // the edge you spent fourteen tiles fighting becomes the edge you need.
  var b1 = bankX(66, 35, 14, 5, zJoin, 0.22, 0.9);      P.push(b1);
  var g3 = gateX(80, 36, 4, 3, b1.exit);                P.push(g3);
  var b2 = bankX(84, 35, 12, 5, b1.exit, 0.22, -0.9);   P.push(b2);

  // Three tiles of void and two units down onto the green, taken at whatever the camber
  // left you with.
  P.push(pad(99, 32, 12, 12, b2.exit - 2.0, SURF.GREEN));
  P.push(greenDish(101, 34, 8, 8, b2.exit - 2.0, 0.4));

  return {
    name: 'THE LADDER',
    parTime: 16, bonus: 3,
    pieces: P,
    start: { x: 4, y: 4 },
    cup: { x: 105, y: 38, r: 0.9 },
    flags: [g1.flag, g2.flag, g3.flag],
    routes: [
      // 0 — LEFT: the ledge, the fragile leg, the flat run out.
      [{ x: 4, y: 4 }, { x: 16, y: 4 }, g1.flag, { x: 30, y: 4 }, { x: 33, y: 8 },
       { x: 33, y: 11.5 }, { x: 33, y: 14 }, { x: 33, y: 24 }, { x: 33, y: 31 },
       { x: 33, y: 36 }, { x: 40, y: 36 }, { x: 48, y: 36 }, { x: 52, y: 35 },
       { x: 60, y: 35 }, g2.flag, { x: 72, y: 37.5 }, g3.flag, { x: 90, y: 37.5 },
       { x: 96, y: 37.5 }, { x: 102, y: 38 }, { x: 105, y: 38 }],
      // 1 — RIGHT: out along the top, round the elbow, down the tube.
      [{ x: 4, y: 4 }, { x: 16, y: 4 }, g1.flag, { x: 30, y: 4 }, { x: 38, y: 5 },
       { x: 50, y: 5 }, { x: 55, y: 6 }, { x: 56, y: 12 }, { x: 56, y: 26 },
       { x: 56, y: 32 }, { x: 58, y: 35 }, { x: 60, y: 35 }, g2.flag,
       { x: 72, y: 37.5 }, g3.flag, { x: 90, y: 37.5 },
       { x: 96, y: 37.5 }, { x: 102, y: 38 }, { x: 105, y: 38 }],
    ],
    // Everything that lives here lives on the RIGHT. The left branch's threat is the
    // paper, and a threat on top of that would be two prices for one decision.
    // The tee peg is OFF the racing line: a static ON it is not an obstacle, it is a
    // wall — the ball jams against an infinite mass and no amount of input gets past.
    hazards: [haz('tee', 12, 2.2), haz('mallet', 44, 5, 0.6),
              haz('goose', 46, 7, 0, 6), haz('post', 51, 41)],
  };
}

// The factories, in play order. Each call builds a FRESH course object: compile() fills
// derived fields in place, so a course is never compiled twice.
var COURSE_DEFS = [practice, ladder];

var _courseCache = [];
function getCourse(i) {
  if (!_courseCache[i]) _courseCache[i] = compile(COURSE_DEFS[i]());
  return _courseCache[i];
}
function courseCount() { return COURSE_DEFS.length; }

/* ===== src/audio.js ===== */
// AUDIO — all synthesized, no assets.
//
// LAW 13.1 — the rolling sound is NOISE, not a tone. A pitched fundamental that tracks
// speed IS the engine cue, whatever you filter it through, and a hard sphere on a hard
// surface has no fundamental at all. Timbre is not the problem; the oscillator is.
//
// The layer reads the simulation's own EVENT LIST and never inspects the world, which is
// also what lets a headless test assert on the graph.

var AUD = null;
var _audioFactory = null;

// The four parts. Per-surface filter shapes are what makes the channel say what you are
// ON as well as how fast: the green darker and softer, sand a bright damped hiss with no
// body, fragile paper ringing, a belt's ticks low and blunt like slats.
var SURF_VOICE = [
  { hp: 260, q: 0.9, gain: 1.00, tilt: 1.00 },   // FAIRWAY
  { hp: 190, q: 0.7, gain: 0.72, tilt: 0.80 },   // GREEN   — darker and softer
  { hp: 300, q: 0.8, gain: 1.15, tilt: 1.05 },   // ROUGH
  { hp: 900, q: 0.5, gain: 0.85, tilt: 1.45 },   // SAND    — bright hiss, no body
  { hp: 200, q: 1.0, gain: 0.60, tilt: 0.70 },   // WATER
  { hp: 150, q: 1.6, gain: 0.95, tilt: 0.62 },   // BELT    — low and blunt, like slats
  { hp: 420, q: 4.5, gain: 1.05, tilt: 1.20 },   // FRAGILE — ringing paper
  { hp: 380, q: 3.0, gain: 1.00, tilt: 1.10 },   // CRACKED
];

// A seeded noise loop. Deterministic: no Math.random anywhere, in any path.
function fillNoise(buf, len) {
  var s = 0x2f6e2b1 >>> 0;
  for (var i = 0; i < len; i++) {
    s = (s * 1664525 + 1013904223) >>> 0;
    buf[i] = ((s >>> 8) / 8388608) - 1;
  }
}

function setAudioFactory(f) { _audioFactory = f; }

function ensureAudio() {
  if (AUD) return AUD;
  var ctx;
  try {
    ctx = _audioFactory ? _audioFactory()
        : new (window.AudioContext || window.webkitAudioContext)();
  } catch (e) { return null; }
  if (!ctx) return null;

  var master = ctx.createGain();
  master.gain.value = 0.55;
  master.connect(ctx.destination);

  var len = Math.floor(ctx.sampleRate * NOISE_SECONDS);
  var buf = ctx.createBuffer(1, len, ctx.sampleRate);
  fillNoise(buf.getChannelData(0), len);

  // THE BED: noise -> highpass -> bandpass -> gain. Nothing is pitched, so nothing can
  // read as a throttle.
  var src = ctx.createBufferSource();
  src.buffer = buf; src.loop = true;
  var hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 260;
  var bp = ctx.createBiquadFilter(); bp.type = 'bandpass';
  bp.frequency.value = ROLL_LO; bp.Q.value = 1.0;
  var rollGain = ctx.createGain(); rollGain.gain.value = 0;
  src.connect(hp); hp.connect(bp); bp.connect(rollGain); rollGain.connect(master);
  try { src.start(0); } catch (e) { /* a fake context need not start */ }

  // AIR: a breath while the ball is lifted.
  var asrc = ctx.createBufferSource();
  asrc.buffer = buf; asrc.loop = true;
  var alp = ctx.createBiquadFilter(); alp.type = 'lowpass'; alp.frequency.value = 900;
  var airGain = ctx.createGain(); airGain.gain.value = 0;
  asrc.connect(alp); alp.connect(airGain); airGain.connect(master);
  try { asrc.start(0); } catch (e) { /* as above */ }

  AUD = { ctx: ctx, master: master, buf: buf, src: src, hp: hp, bp: bp,
          rollGain: rollGain, airGain: airGain, alp: alp,
          muted: false, cell: -1, lastSurf: -1 };
  return AUD;
}

function setMuted(m) {
  var a = ensureAudio();
  if (!a) return;
  a.muted = m;
  a.master.gain.value = m ? 0 : 0.55;
}

// A short filtered noise burst. Everything in this game that is not the rolling bed is
// one of these, shaped differently.
function burst(a, freq, q, gain, dur, type) {
  var s = a.ctx.createBufferSource();
  s.buffer = a.buf; s.loop = true;
  var f = a.ctx.createBiquadFilter();
  f.type = type || 'bandpass'; f.frequency.value = freq; f.Q.value = q;
  var g = a.ctx.createGain();
  var t = a.ctx.currentTime;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(gain, t + 0.005);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(a.master);
  try { s.start(t); s.stop(t + dur + 0.02); } catch (e) { /* fake context */ }
}

// The flag and the cup are UI chimes, not the rolling channel: LAW 13.1 is about the bed.
function chime(a, f0, f1, dur, gain) {
  var o = a.ctx.createOscillator();
  o.type = 'triangle';
  var g = a.ctx.createGain();
  var t = a.ctx.currentTime;
  o.frequency.setValueAtTime(f0, t);
  o.frequency.linearRampToValueAtTime(f1, t + dur * 0.8);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(gain, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(a.master);
  try { o.start(t); o.stop(t + dur + 0.02); } catch (e) { /* fake context */ }
}

// The rolling channel. Speed opens and brightens the band; the SURFACE is its voice; and
// ball.bank lifts and tightens it, so riding a tube's rim is audible before it is visible.
function audioRoll(a, run) {
  var b = run.ball, g = run.grid;
  var lifted = b.lift >= BALL_R * 0.8 || b.state === ST.FALL;
  var sp = Math.hypot(b.vx, b.vy);
  var surf = solidAt(g, b.x, b.y) === 1 ? surfAt(g, b.x, b.y) : SURF.FAIRWAY;
  var v = SURF_VOICE[surf];

  if (lifted || b.state !== ST.ROLL) {
    a.rollGain.gain.value = 0;
    // The channel switches on lift, not on ball.air: the launch test makes `air` flicker
    // on undulating ground and the rolling sound would stutter with it.
    a.airGain.gain.value = lifted && b.state !== ST.SINK ? 0.09 : 0;
    return;
  }
  a.airGain.gain.value = 0;

  var f = Math.min(1, sp / MAX_SPEED);
  var centre = (ROLL_LO + (ROLL_HI - ROLL_LO) * f) * v.tilt;
  // The bank lifts and tightens the band.
  a.bp.frequency.value = centre * (1 + b.bank * 0.55);
  a.bp.Q.value = v.q * (1 + b.bank * 2.6);
  a.hp.frequency.value = v.hp;
  a.rollGain.gain.value = Math.pow(f, 1.5) * 0.5 * v.gain;
}

// CREASES carry the speed: one click per lattice line crossed, taken from the ball's CELL
// rather than from a timer, so the rate IS the speed. Discrete taps on the folds slowly,
// a rustle at pace. This is the papercraft in the sound.
function audioCreases(a, run) {
  var b = run.ball;
  if (b.state !== ST.ROLL || b.lift >= BALL_R * 0.8) { a.cell = -1; return; }
  var k = cellIndex(run.grid, b.x, b.y);
  if (k === a.cell || k < 0) return;
  var first = a.cell < 0;
  a.cell = k;
  if (first) return;
  var sp = Math.hypot(b.vx, b.vy);
  var v = SURF_VOICE[surfAt(run.grid, b.x, b.y)];
  burst(a, 1500 * v.tilt, 2.5, Math.min(0.16, 0.03 + sp * 0.008), 0.045);
}

var ONESHOT = {
  flag:      function (a) { chime(a, 660, 990, 0.28, 0.16); },
  cup:       function (a) { chime(a, 520, 1240, 0.55, 0.20); },
  crack:     function (a) { burst(a, 2400, 6, 0.13, 0.11); },
  collapse:  function (a) { burst(a, 380, 1.2, 0.22, 0.42, 'lowpass'); },
  splash:    function (a) { burst(a, 700, 0.8, 0.22, 0.5, 'lowpass'); },
  eaten:     function (a) { burst(a, 240, 0.7, 0.26, 0.6, 'lowpass'); },
  lost:      function (a) { burst(a, 300, 1.0, 0.10, 0.35, 'lowpass'); },
  respawn:   function (a) { chime(a, 400, 620, 0.20, 0.10); },
  flatten:   function (a) { burst(a, 190, 1.0, 0.26, 0.20, 'lowpass'); },
  rivaldown: function (a) { burst(a, 520, 1.4, 0.14, 0.30, 'lowpass'); },
  land:      function (a, e) { burst(a, 240 + Math.min(600, e.a * 40), 1.1,
                                    Math.min(0.24, 0.05 + e.a * 0.016), 0.14, 'lowpass'); },
  knock:     function (a, e) { burst(a, 900, 2.2, Math.min(0.22, 0.03 + e.a * 0.02), 0.10); },
};

function playEvents(run) {
  var a = ensureAudio();
  if (!a) { run.events.length = 0; return; }
  if (!a.muted) {
    for (var i = 0; i < run.events.length; i++) {
      var e = run.events[i], fn = ONESHOT[e.kind];
      if (fn) fn(a, e);
    }
    audioRoll(a, run);
    audioCreases(a, run);
  } else {
    a.rollGain.gain.value = 0;
    a.airGain.gain.value = 0;
  }
  run.events.length = 0;
}

/* ===== src/render.js ===== */
// RENDERING — banded isometric drawing straight off the lattice (LAW 4.5).
// The projection is not to be rewritten once it works.
//
// Nothing here is ever proof of anything. It runs against a recording canvas stub with
// no DOM in the suite, which is how tests 22, 34, 45 and 46 exist at all.

var RSTAT = { fills: 0, strokes: 0, cells: 0, props: 0 };

function rFill(ctx) { ctx.fill(); RSTAT.fills++; }
function rStroke(ctx) { ctx.stroke(); RSTAT.strokes++; }

// ---- shading ----------------------------------------------------------------
// LAW 12.1 — a slope you cannot see is unfair, not hard. Flat paper's Lambert lambda is
// 0.727 and the steepest thing anyone rolls on moves it a TENTH; quantised into twelve
// buckets that is one bucket, and a camber comes out the same colour as the flat lane
// beside it. So stretch the band the game actually occupies across the buckets BEFORE
// quantising. Flat ground still lands on bucket 7 of 12; what changes is that a 0.175
// cross-slope now moves it two buckets rather than none.
function shadeBucket(nx, ny, nz) {
  var lam = nx * LIGHT[0] + ny * LIGHT[1] + nz * LIGHT[2];
  var k = Math.floor(((lam - SHADE_LO) / (SHADE_HI - SHADE_LO)) * (SHADES - 1));
  return k < 0 ? 0 : (k > SHADES - 1 ? SHADES - 1 : k);
}

function clamp255(v) { return v < 0 ? 0 : (v > 255 ? 255 : v | 0); }

// surface x shade -> one css colour, computed once.
var SHADE_TABLE = (function () {
  var t = [];
  for (var s = 0; s < SURF_RGB.length; s++) {
    t[s] = [];
    for (var k = 0; k < SHADES; k++) {
      var l = 0.42 + 0.66 * (k / (SHADES - 1));
      t[s][k] = 'rgb(' + clamp255(SURF_RGB[s][0] * l) + ',' +
                         clamp255(SURF_RGB[s][1] * l) + ',' +
                         clamp255(SURF_RGB[s][2] * l) + ')';
    }
  }
  return t;
})();

// The backdrop wash, sampled. Slab side faces shade against this same ramp, so the
// further down the screen a wall runs the more it dissolves into the drop.
var SKY_STOPS = [[0.00, 244, 234, 212], [0.30, 196, 170, 172],
                 [0.58, 108, 92, 122], [0.80, 42, 36, 58], [1.00, 11, 10, 18]];
function skyAt(q) {
  if (q < 0) q = 0; else if (q > 1) q = 1;
  for (var i = 1; i < SKY_STOPS.length; i++) {
    if (q > SKY_STOPS[i][0]) continue;
    var a = SKY_STOPS[i - 1], b = SKY_STOPS[i];
    var f = (q - a[0]) / (b[0] - a[0]);
    return [a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f, a[3] + (b[3] - a[3]) * f];
  }
  return [11, 10, 18];
}

var WALL_ROWS = 20;
var WALL_TABLE = (function () {
  var t = [];
  for (var s = 0; s < SURF_RGB.length; s++) {
    t[s] = [];
    for (var r = 0; r < WALL_ROWS; r++) {
      var q = r / (WALL_ROWS - 1);
      var sky = skyAt(0.25 + q * 0.75);
      // The cut edge of folded paper: the surface's own colour, darkened, dissolving
      // into the drop as it runs down the screen.
      var m = 0.62 - 0.42 * q;
      t[s][r] = 'rgb(' + clamp255(SURF_RGB[s][0] * m + sky[0] * q * 0.55) + ',' +
                         clamp255(SURF_RGB[s][1] * m + sky[1] * q * 0.55) + ',' +
                         clamp255(SURF_RGB[s][2] * m + sky[2] * q * 0.55) + ')';
    }
  }
  return t;
})();
var ABYSS = 'rgb(9,8,14)';
function wallRow(sy) {
  var r = Math.floor((sy / H) * WALL_ROWS);
  return r < 0 ? 0 : (r > WALL_ROWS - 1 ? WALL_ROWS - 1 : r);
}

// ---- the wind ---------------------------------------------------------------
// One global oscillator, and everything alive reads from it with a per-object phase.
// This is the whole of "the world must not feel static" and it costs one function.
// A flag that raises on a checkpoint and then stands rigid is a flag that only moved once.
function wind(t, phase) {
  return Math.sin(1.1 * (t + phase)) + 0.4 * Math.sin(2.53 * (t + phase));
}

// ---- the camera --------------------------------------------------------------
function newCam(ball) { return { x: ball.x, y: ball.y, z: ball.z }; }
function updateCamera(cam, ball, dt) {
  var k = 1 - Math.exp(-CAM_SMOOTH * dt);
  cam.x += (ball.x + ball.vx * CAM_LEAD - cam.x) * k;
  cam.y += (ball.y + ball.vy * CAM_LEAD - cam.y) * k;
  cam.z += (ball.z - cam.z) * k;
}

// ---- the backdrop -------------------------------------------------------------
// A void that is one colour is not a void, it is an absence of information. With nothing
// static anywhere in frame the eye locks onto the course's own boundary, and a boundary
// that holds still while everything else is featureless reads as THE BACKGROUND SLIDING.
var RIDGE = (function () {
  // Deterministic silhouettes — no RNG in any path the game takes. Three layers of folded
  // paper hills, each at its own parallax rate.
  var L = [];
  for (var i = 0; i < 3; i++) {
    var pts = [], n = 13;
    for (var k = 0; k <= n; k++) {
      var a = k * (1.7 + i * 0.9) + i * 2.1;
      pts.push(0.5 + 0.5 * Math.sin(a) + 0.28 * Math.sin(a * 2.3 + i));
    }
    L.push(pts);
  }
  return L;
})();

function drawBackdrop(ctx, cam, t) {
  var gr = ctx.createLinearGradient(0, 0, 0, H);
  for (var i = 0; i < SKY_STOPS.length; i++) {
    var s = SKY_STOPS[i];
    gr.addColorStop(s[0], 'rgb(' + s[1] + ',' + s[2] + ',' + s[3] + ')');
  }
  ctx.fillStyle = gr;
  ctx.fillRect(0, 0, W, H);
  RSTAT.fills++;

  // The camera moves against the wash at its own rate, on both axes, so there is
  // something fixed in frame for the eye to measure the course's motion against.
  var horizon = H * 0.30;
  for (var L = 0; L < 3; L++) {
    var rate = 0.06 + L * 0.055;
    var ox = -(cam.x - cam.y) * TILE * 0.5 * rate * 0.35;
    var oy = -(cam.x + cam.y) * TILE * 0.25 * rate * 0.5 + (cam.z * Z_SCALE) * rate * 0.5;
    var top = horizon - 118 + L * 46 + oy;
    var pts = RIDGE[L], n = pts.length - 1;
    var span = W * 1.9, step = span / n;
    var amp = 96 - L * 26;
    ctx.beginPath();
    ctx.moveTo(-W * 0.45 + ox, H);
    for (var k = 0; k <= n; k++)
      ctx.lineTo(-W * 0.45 + ox + k * step, top - pts[k] * amp);
    ctx.lineTo(-W * 0.45 + ox + span, H);
    ctx.closePath();
    var sky = skyAt(0.30 + L * 0.10);
    ctx.fillStyle = 'rgb(' + clamp255(sky[0] * 0.80) + ',' + clamp255(sky[1] * 0.78) + ',' +
                    clamp255(sky[2] * 0.88) + ')';
    rFill(ctx);
  }

  // Cloud shadows drift on the same oscillator everything alive reads from.
  for (var c = 0; c < 3; c++) {
    var w2 = wind(t, c * 3.1);
    var cx = ((c * 0.37 + t * 0.006 + w2 * 0.004) % 1) * (W + 500) - 250
           - (cam.x - cam.y) * TILE * 0.5 * 0.04;
    var cy = horizon - 70 + c * 34 + w2 * 5;
    ctx.beginPath();
    ctx.ellipse(cx, cy, 150 - c * 26, 17 - c * 3, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,248,232,' + (0.13 - c * 0.03).toFixed(3) + ')';
    rFill(ctx);
  }
}

// ---- prop volumes -------------------------------------------------------------
// Four primitives, in two or three flat tones each. No gradients, no outlines, lit from
// the terrain's own direction. Screen-axis-aligned polygon stacks are what this replaced
// and they read as flat: "the windmill and every item you made is just blocks put
// together". Every length here is a multiple of TILE or Z_SCALE.

function tone(rgb, m) {
  return 'rgb(' + clamp255(rgb[0] * m) + ',' + clamp255(rgb[1] * m) + ',' + clamp255(rgb[2] * m) + ')';
}
var LIT = 1.16, MID = 0.92, DARK = 0.66;

function orb(ctx, sx, sy, r, rgb) {
  ctx.beginPath(); ctx.arc(sx, sy, r, 0, Math.PI * 2);
  ctx.fillStyle = tone(rgb, MID); rFill(ctx);
  ctx.beginPath();
  ctx.ellipse(sx - r * 0.30, sy - r * 0.34, r * 0.62, r * 0.52, -0.5, 0, Math.PI * 2);
  ctx.fillStyle = tone(rgb, LIT); rFill(ctx);
}

// A vertical cylinder: an elliptical cap, a lit half-body and a shaded half-body.
function tubeP(ctx, sx, sy, r, hgt, rgb) {
  var ry = r * 0.45;
  ctx.beginPath();
  ctx.moveTo(sx - r, sy);
  ctx.lineTo(sx - r, sy - hgt);
  ctx.lineTo(sx, sy - hgt);
  ctx.lineTo(sx, sy);
  ctx.closePath();
  ctx.fillStyle = tone(rgb, LIT); rFill(ctx);
  ctx.beginPath();
  ctx.moveTo(sx, sy); ctx.lineTo(sx, sy - hgt);
  ctx.lineTo(sx + r, sy - hgt); ctx.lineTo(sx + r, sy);
  ctx.closePath();
  ctx.fillStyle = tone(rgb, DARK); rFill(ctx);
  ctx.beginPath();
  ctx.ellipse(sx, sy - hgt, r, ry, 0, 0, Math.PI * 2);
  ctx.fillStyle = tone(rgb, LIT * 1.06); rFill(ctx);
}

function coneP(ctx, sx, sy, r, hgt, rgb) {
  ctx.beginPath();
  ctx.moveTo(sx, sy - hgt);
  ctx.lineTo(sx - r, sy);
  ctx.lineTo(sx, sy + r * 0.42);
  ctx.closePath();
  ctx.fillStyle = tone(rgb, LIT); rFill(ctx);
  ctx.beginPath();
  ctx.moveTo(sx, sy - hgt);
  ctx.lineTo(sx, sy + r * 0.42);
  ctx.lineTo(sx + r, sy);
  ctx.closePath();
  ctx.fillStyle = tone(rgb, DARK); rFill(ctx);
}

// An isometric box: a top rhombus and the two camera-facing side faces, in three tones.
function boxIso(ctx, sx, sy, wx, wy, hgt, rgb) {
  var ax = wx * TILE / 2, ay = wx * TILE / 4;
  var bx = -wy * TILE / 2, by = wy * TILE / 4;
  var tx = sx, ty = sy - hgt;
  ctx.beginPath();
  ctx.moveTo(tx, ty);
  ctx.lineTo(tx + ax, ty + ay);
  ctx.lineTo(tx + ax + bx, ty + ay + by);
  ctx.lineTo(tx + bx, ty + by);
  ctx.closePath();
  ctx.fillStyle = tone(rgb, LIT); rFill(ctx);
  ctx.beginPath();
  ctx.moveTo(tx + ax, ty + ay);
  ctx.lineTo(tx + ax + bx, ty + ay + by);
  ctx.lineTo(sx + ax + bx, sy + ay + by);
  ctx.lineTo(sx + ax, sy + ay);
  ctx.closePath();
  ctx.fillStyle = tone(rgb, MID); rFill(ctx);
  ctx.beginPath();
  ctx.moveTo(tx + bx, ty + by);
  ctx.lineTo(tx + ax + bx, ty + ay + by);
  ctx.lineTo(sx + ax + bx, sy + ay + by);
  ctx.lineTo(sx + bx, sy + by);
  ctx.closePath();
  ctx.fillStyle = tone(rgb, DARK); rFill(ctx);
}

// ---- the art roster ----------------------------------------------------------
// Every length below is authored against TILE, never against pixels. MAX_SPEED once moved
// 14 -> 26, TILE fell 96 -> 50 with it, and every prop in the game stayed the size it had
// been drawn for at 96. They were not merely weak, they were half-size.
var U = TILE / 50;                 // one "authored unit": TILE-relative, so nothing drifts

var ART = {
  tree: function (ctx, x, y, t, b) {
    var sway = wind(t, b.phase) * 3.5 * U;
    tubeP(ctx, x, y, 4 * U, 22 * U, [150, 116, 84]);
    coneP(ctx, x + sway * 0.5, y - 20 * U, 21 * U, 34 * U, [92, 158, 96]);
    coneP(ctx, x + sway, y - 38 * U, 15 * U, 26 * U, [112, 178, 108]);
  },
  tee: function (ctx, x, y) {
    tubeP(ctx, x, y, 2.6 * U, 11 * U, [236, 228, 206]);
    ctx.beginPath();
    ctx.ellipse(x, y - 11 * U, 5.2 * U, 2.4 * U, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgb(250,244,224)'; rFill(ctx);
  },
  bench: function (ctx, x, y) {
    boxIso(ctx, x, y, 1.5, 0.5, 9 * U, [198, 156, 112]);
    boxIso(ctx, x, y - 9 * U, 1.5, 0.5, 4 * U, [176, 134, 96]);
  },
  post: function (ctx, x, y) {
    tubeP(ctx, x, y, 3 * U, 26 * U, [232, 226, 210]);
    tubeP(ctx, x, y - 26 * U, 4.4 * U, 5 * U, [232, 96, 96]);
  },
  windmill: function (ctx, x, y, t, b) {
    // A rotor with a HUB. The first build drew three blades orbiting nothing.
    // The tower tapers into the cap rather than being a cube with a hat balanced on it.
    tubeP(ctx, x, y, 13 * U, 22 * U, [238, 232, 214]);
    tubeP(ctx, x, y - 22 * U, 9 * U, 8 * U, [226, 219, 198]);
    coneP(ctx, x, y - 30 * U, 12 * U, 16 * U, [216, 108, 96]);
    var a = t * 1.6 + b.phase, hy = y - 34 * U;
    for (var i = 0; i < 4; i++) {
      var an = a + i * Math.PI / 2;
      ctx.beginPath();
      ctx.moveTo(x, hy);
      ctx.lineTo(x + Math.cos(an) * 25 * U, hy + Math.sin(an) * 12 * U);
      ctx.lineTo(x + Math.cos(an + 0.34) * 22 * U, hy + Math.sin(an + 0.34) * 11 * U);
      ctx.closePath();
      ctx.fillStyle = i % 2 ? 'rgb(226,220,200)' : 'rgb(250,246,232)';
      rFill(ctx);
    }
    orb(ctx, x, hy, 4.5 * U, [120, 104, 96]);
  },
  washer: function (ctx, x, y) {
    tubeP(ctx, x, y, 3 * U, 13 * U, [190, 186, 176]);
    orb(ctx, x, y - 13 * U, 7 * U, [156, 190, 210]);    // seated ON the post, not floating
  },
  mallet: function (ctx, x, y, t, b) {
    var lean = Math.sin(b.def.omega * t + b.phase) * 0.5;
    ctx.save(); ctx.translate(x, y - 30 * U); ctx.rotate(lean); ctx.translate(-x, -(y - 30 * U));
    tubeP(ctx, x, y, 2.4 * U, 30 * U, [176, 140, 100]);
